/* ---------- diagram ---------- */
function wrapText(t,maxCh){
  const words=String(t).split(/\s+/).filter(Boolean), out=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxCh&&cur){out.push(cur);cur=w;} else cur=(cur+' '+w).trim(); }
  if(cur) out.push(cur); return out;
}
function textBlock(t,cx,cy,w,h,fs,anchorTop){
  const cw=fs*0.56; let size=fs, maxCh=Math.max(6,Math.floor((w-8)/cw)), L=wrapText(t,maxCh);
  if(!anchorTop){ while(L.length*size*1.15>h-6&&size>7){size-=0.5; maxCh=Math.max(6,Math.floor((w-6)/(size*0.56))); L=wrapText(t,maxCh);} }
  const lh=size*1.15, y0=anchorTop?cy+size:cy-(L.length-1)*lh/2+size*0.35;
  return `<text font-size="${size}" text-anchor="middle" fill="var(--ink)">${L.map((l,i)=>`<tspan x="${cx}" y="${(y0+i*lh).toFixed(1)}">${esc(l)}</tspan>`).join('')}</text>`;
}
function drawDiagram(d){
  const xs=[],ys=[];
  const add=(x,y,w,h)=>{xs.push(x,x+(w||0));ys.push(y,y+(h||0));};
  add(d.pool.x,d.pool.y,d.pool.w,d.pool.h); d.lanes.forEach(l=>add(l.x,l.y,l.w,l.h)); d.nodes.forEach(n=>add(n.x,n.y,n.w,n.h+(n.k==='task'||n.k==='sub'?0:40))); d.arts.forEach(a=>add(a.x,a.y,a.w,a.h+30)); d.edges.forEach(e=>e.p.forEach(p=>add(p[0],p[1])));
  const minX=Math.min(...xs)-20, minY=Math.min(...ys)-20, W=Math.max(...xs)-minX+20, H=Math.max(...ys)-minY+20;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${W} ${H}" width="${W}" height="${H}" font-family="IBM Plex Sans, system-ui, sans-serif" role="img" aria-label="Fluxo ${esc(d.nome)}">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--soft)"/></marker></defs>`;
  const laneX=d.lanes.length?Math.min(...d.lanes.map(l=>l.x)):d.pool.x;
  s+=`<rect x="${d.pool.x}" y="${d.pool.y}" width="${d.pool.w}" height="${d.pool.h}" fill="var(--lane)" stroke="var(--line)" />`;
  if(laneX>d.pool.x){ s+=`<rect x="${d.pool.x}" y="${d.pool.y}" width="${laneX-d.pool.x}" height="${d.pool.h}" fill="var(--lane-head)" stroke="var(--line)"/>`;
    const cx=d.pool.x+(laneX-d.pool.x)/2, cy=d.pool.y+d.pool.h/2; s+=`<text transform="translate(${cx+4} ${cy}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${esc(d.nome).slice(0,90)}</text>`; }
  d.lanes.forEach(l=>{ s+=`<rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" fill="none" stroke="var(--line)"/><rect x="${l.x}" y="${l.y}" width="26" height="${l.h}" fill="var(--lane-head)" stroke="var(--line)"/>`;
    const L=wrapText(l.t,Math.max(8,Math.floor((l.h-10)/6.2))).slice(0,2), cx=l.x+13, cy=l.y+l.h/2;
    s+=`<text transform="translate(${cx} ${cy}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${L.map((t,i)=>`<tspan x="0" y="${(i-(L.length-1)/2)*12+4}">${esc(t)}</tspan>`).join('')}</text>`; });
  d.edges.forEach(e=>{ const pts=e.p.map(p=>p.join(',')).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="var(--soft)" stroke-width="1.3" marker-end="url(#ar)"/>`;
    if(e.t){ let best=0,bi=0; for(let i=0;i<e.p.length-1;i++){const dl=Math.hypot(e.p[i+1][0]-e.p[i][0],e.p[i+1][1]-e.p[i][1]); if(dl>best){best=dl;bi=i;}}
      const a=e.p[bi],b=e.p[bi+1], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, horiz=Math.abs(b[1]-a[1])<2;
      s+=`<text x="${horiz?mx:mx+6}" y="${horiz?my-5:my}" font-size="10" font-weight="600" fill="var(--accent-ink)" text-anchor="${horiz?'middle':'start'}">${esc(e.t)}</text>`; } });
  d.arts.forEach(a=>{
    if(a.k==='Annotation'){ s+=`<path d="M${a.x+10} ${a.y}H${a.x}V${a.y+a.h}H${a.x+10}" fill="none" stroke="var(--muted)"/>`;
      const L=wrapText(a.t,Math.max(10,Math.floor((a.w-8)/5))).slice(0,Math.max(1,Math.floor(a.h/11))); s+=`<text font-size="9.5" fill="var(--soft)">${L.map((t,i)=>`<tspan x="${a.x+5}" y="${a.y+11+i*11}">${esc(t)}</tspan>`).join('')}</text>`; }
    else if(a.k==='store'){ const x=a.x,y=a.y,w=a.w,h=a.h; s+=`<path d="M${x} ${y+6}C${x} ${y-2} ${x+w} ${y-2} ${x+w} ${y+6}V${y+h-6}C${x+w} ${y+h+2} ${x} ${y+h+2} ${x} ${y+h-6}Z M${x} ${y+6}C${x} ${y+14} ${x+w} ${y+14} ${x+w} ${y+6}" fill="var(--task)" stroke="var(--task-line)"/>`+(a.t?textBlock(a.t,x+w/2,y+h+2,130,40,9.5,true):''); }
    else if(a.k==='DataObject'){ const x=a.x,y=a.y,w=a.w,h=a.h; s+=`<path d="M${x} ${y}H${x+w-10}L${x+w} ${y+10}V${y+h}H${x}Z" fill="var(--task)" stroke="var(--task-line)"/>`+(a.t?textBlock(a.t,x+w/2,y+h+2,130,40,9.5,true):''); }
  });
  d.nodes.forEach(n=>{ const cx=n.x+n.w/2, cy=n.y+n.h/2;
    if(n.k==='task'||n.k==='sub'){ s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="var(--task)" stroke="var(--task-line)" stroke-width="1.2"/>`+textBlock(n.t,cx,cy-(n.k==='sub'?4:0),n.w,n.h-(n.k==='sub'?10:0),10);
      if(n.k==='sub') s+=`<rect x="${cx-5}" y="${n.y+n.h-12}" width="10" height="10" fill="none" stroke="var(--task-line)"/><path d="M${cx-3} ${n.y+n.h-7}h6M${cx} ${n.y+n.h-10}v6" stroke="var(--task-line)"/>`; }
    else if(n.k==='gateway'){ s+=`<path d="M${cx} ${n.y}L${n.x+n.w} ${cy}L${cx} ${n.y+n.h}L${n.x} ${cy}Z" fill="var(--gate)" stroke="var(--gate-line)" stroke-width="1.3"/><path d="M${cx-7} ${cy-7}L${cx+7} ${cy+7}M${cx+7} ${cy-7}L${cx-7} ${cy+7}" stroke="var(--gate-line)" stroke-width="2"/>`;
      if(n.t) s+=textBlock(n.t,cx,n.y+n.h+2,130,40,9.5,true); }
    else { const r=n.w/2, col=n.k==='start'?'var(--start)':(n.k==='end'?'var(--end)':'var(--steel)'), sw=n.k==='end'?3.5:1.6;
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--task)" stroke="${col}" stroke-width="${sw}"/>`+(n.k==='inter'?`<circle cx="${cx}" cy="${cy}" r="${r-3}" fill="none" stroke="${col}" stroke-width="1.2"/>`:'');
      if(n.t) s+=textBlock(n.t,cx,n.y+n.h+2,120,40,9.5,true); }
  });
  return {svg:s+'</svg>',W,H};
}

function flowTab(p){
  if(!p.diagramas.length) return `<div class="panel empty">Este processo ainda não tem fluxo desenhado no Bizagi.</div>`;
  const i=Math.min(state.diag[p.id]||0,p.diagramas.length-1), d=p.diagramas[i];
  const chips=p.diagramas.length>1?`<div class="chips" role="group" aria-label="Fluxos do processo">${p.diagramas.map((x,k)=>`<button class="chip" data-diag="${k}" aria-pressed="${k===i}">${esc(x.nome)}</button>`).join('')}</div>`:`<h3>${esc(d.nome)}</h3>`;
  return `<div class="stack"><div class="dg-bar">${chips}<div class="zoom"><button data-z="-" aria-label="Diminuir zoom">−</button><button data-z="fit">Ajustar</button><button data-z="+" aria-label="Aumentar zoom">+</button></div></div>
  <div class="canvas" id="canvas"></div>
  <div class="legend"><span><i class="lg"></i>Atividade</span><span><i class="lg g"></i>Decisão</span><span><i class="lg s"></i>Início</span><span><i class="lg e"></i>Fim</span><span>Faixas = quem executa · arraste para navegar</span></div></div>`;
}
function mountFlow(p){
  const c=$('#canvas'); if(!c) return;
  const i=Math.min(state.diag[p.id]||0,p.diagramas.length-1), d=p.diagramas[i], r=drawDiagram(d);
  c.innerHTML=r.svg; const svg=c.querySelector('svg');
  const fit=()=>Math.min(1.2,Math.max(0.6,(c.clientWidth-2)/r.W));
  const key=p.id+':'+i; if(state.zoom[key]==null) state.zoom[key]=fit();
  const apply=()=>{ const z=state.zoom[key]; svg.setAttribute('width',Math.round(r.W*z)); svg.setAttribute('height',Math.round(r.H*z)); };
  apply();
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const v=b.dataset.z; state.zoom[key]=v==='fit'?fit():Math.min(2.5,Math.max(0.25,state.zoom[key]*(v==='+'?1.2:1/1.2))); apply(); });
  let sx,sy,sl,st,down=false;
  c.onpointerdown=e=>{ if(e.pointerType!=='mouse') return; down=true; sx=e.clientX; sy=e.clientY; sl=c.scrollLeft; st=c.scrollTop; c.classList.add('drag'); };
  window.onpointermove=e=>{ if(!down) return; c.scrollLeft=sl-(e.clientX-sx); c.scrollTop=st-(e.clientY-sy); };
  window.onpointerup=()=>{ down=false; c.classList.remove('drag'); };
}
function rulesTab(p){
  const entries=Object.entries(p.regras).filter(([k])=>!/^Processo$/i.test(k));
  const lab=k=>{for(const [re,l] of RULE_LABEL) if(re.test(k.trim())) return l; return k.replace(/\s+/g,' ');};
  const cards=entries.map(([k,v])=>{ const L=lines(v), l=lab(k), wide=/Crit|Desafio/.test(l);
    return `<div class="rule ${wide?'wide':''} ${/Desafio/.test(l)?'challenge':''}"><h3>${esc(l)}</h3>${L.length>1?`<ul>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(L[0]||'')}</p>`}</div>`;}).join('');
  const kv=`<div class="panel"><dl class="kv">
    <dt>Conceito</dt><dd>${esc(p.conceito||'—')}</dd>
    ${p.sub?`<dt>Subprocessos</dt><dd>${esc(p.sub)}</dd>`:''}
    <dt>Onde fica hoje</dt><dd>${esc(lines(p.armazenamento).join(' · ')||'—')}</dd>
    <dt>Key user</dt><dd>${esc(p.keyuser)}</dd>
    ${p.pdfs.length?`<dt>PDFs no pacote</dt><dd>${esc(p.pdfs.join(' · '))}</dd>`:''}
  </dl></div>`;
  return `<div class="stack">${kv}${entries.length?`<div class="rules">${cards}</div>`:`<div class="panel empty">Regras de negócio não preenchidas.</div>`}</div>`;
}
function raciTab(p){
  if(!p.raci.length) return `<div class="panel empty">RACI não preenchido.</div>`;
  const L=v=>{const t=String(v).toUpperCase().replace(/[^RACI\/,]/g,''); return t?t.split(/[\/,]/).filter(Boolean).map(x=>`<span class="L ${x}" title="${({R:'Responsável (executa)',A:'Aprova',C:'Consultado',I:'Informado'})[x]||''}">${x}</span>`).join(' '):'';};
  return `<div class="stack"><p class="note"><span class="L R">R</span> executa · <span class="L A">A</span> aprova · <span class="L C">C</span> é consultado · <span class="L I">I</span> é informado</p>
  <div class="tbl-wrap"><table class="raci"><thead><tr><th>#</th><th>Etapa</th>${p.atores.map(a=>`<th class="a">${esc(a)}</th>`).join('')}</tr></thead><tbody>
  ${p.raci.map((r,i)=>`<tr><td class="step">${String(i+1).padStart(2,'0')}</td><td>${esc(r.etapa)}</td>${p.atores.map((a,k)=>`<td class="l">${L(r.r[k]||'')}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>`;
}
function sipocTab(p){
  if(!p.sipoc.length) return `<div class="panel empty">SIPOC não preenchido.</div>`;
  const H=[['S','Fornecedores'],['I','Entradas'],['P','Processo'],['O','Saídas'],['C','Clientes']];
  return `<div class="tbl-wrap"><table class="sipoc"><thead><tr>${H.map(h=>`<th>${h[0]}<small>${h[1]}</small></th>`).join('')}</tr></thead><tbody>${p.sipoc.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function dataTab(p){
  if(!p.tabelas.length) return `<div class="panel empty">Nenhum dado levantado neste mapeamento.</div>`;
  const byFile=new Map(); p.tabelas.forEach(t=>{const k=t[0]||'Sem nome'; if(!byFile.has(k)) byFile.set(k,{st:t[1],rows:[]}); byFile.get(k).rows.push(t);});
  return `<div class="stack"><p class="note">${byFile.size} arquivos ou registros usados hoje, com ${p.tabelas.length} campos. É a base para planejar a carga de dados no SAP.</p>
  ${[...byFile].map(([f,o],i)=>`<details class="file" ${i===0?'open':''}><summary>${esc(f)}<span>${o.rows.length} campos${o.st?' · '+esc(o.st):''}</span></summary><div class="tbl-wrap"><table><thead><tr><th>Campo</th><th>O que é</th></tr></thead><tbody>${o.rows.map(r=>`<tr><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}</div>`;
}
function sapTab(p){
  const txt=esc(p.sap).replace(/\b([A-Z]{2,4}\d{2,3}[A-Z]?)\b/g,'<code>$1</code>');
  return `<div class="stack"><div class="sap">${txt}</div><p class="note">Recomendação do Head do módulo pelo padrão SAP (best practices). É ponto de partida para o workshop de fit-to-standard e pode mudar no Explore.</p></div>`;
}
const TABS=[['fluxo','Fluxo',p=>p.diagramas.length],['regras','Regras',p=>Object.keys(p.regras).length],['raci','RACI',p=>p.raci.length],['sipoc','SIPOC',p=>p.sipoc.length],['dados','Dados',p=>p.tabelas.length],['sap','No SAP',()=>null]];
function proc(p){
  const tab=state.tab[p.id]||(p.diagramas.length?'fluxo':'regras');
  const body={fluxo:flowTab,regras:rulesTab,raci:raciTab,sipoc:sipocTab,dados:dataTab,sap:sapTab}[tab](p);
  return `<div><p class="eyebrow">${esc(p.grupo)} · key user ${esc(p.keyuser)}</p><h1>${esc(p.titulo)}</h1></div>
  <div class="meta"><span class="pill ${statusCls(p.status)}">${esc(p.status)}</span>${p.diagramas.length?`<span class="pill steel">${p.diagramas.length} fluxo${p.diagramas.length>1?'s':''} no Bizagi</span>`:''}</div>
  ${p.conceito?`<p class="lede">${esc(p.conceito)}</p>`:''}
  ${ALERTS[p.id]?`<div class="alert"><b>Atenção</b><span>${esc(ALERTS[p.id])}</span></div>`:''}
  <div class="tabs" role="tablist">${TABS.map(([k,l,c])=>{const n=c(p);return `<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`;}).join('')}</div>
  <div role="tabpanel">${body}</div>`;
}
function route(){
  const id=location.hash.slice(1); const p=DATA.find(x=>x.id===id);
  $('#view').innerHTML=p?proc(p):home();
  renderNav();
  if(p){
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab[p.id]=b.dataset.tab; try{localStorage.setItem('tab',b.dataset.tab)}catch(e){} rerender(p);});
    document.querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>{state.diag[p.id]=+b.dataset.diag; rerender(p);});
    mountFlow(p);
  }
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
}
function rerender(p){ const y=window.scrollY; route(); window.scrollTo(0,y); }
window.addEventListener('hashchange',()=>{route(); window.scrollTo(0,0);});
$('#q').addEventListener('input',renderNav);
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o);});
/* perfil (Cloudflare Access) */
function initials(name,email){ const src=(name||'').trim()||(email||'').split('@')[0]; const parts=src.split(/[\s._-]+/).filter(Boolean); return ((parts[0]||'?')[0]+((parts[1]||'')[0]||'')).toUpperCase(); }
function showProfile(id){
  const email=id.email||'', name=id.name||'';
  const ini=initials(name,email);
  $('#profileBtn').textContent=ini; $('#pmAvatar').textContent=ini;
  $('#pmName').textContent=name||email.split('@')[0]||'Usuário'; $('#pmEmail').textContent=email;
  if(id.iat){ try{ $('#pmMeta').textContent='Conectado desde '+new Date(id.iat*1000).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'.'; }catch(e){} }
  $('#profileBtn').hidden=false;
}
function cookieIdentity(){
  try{ const c=document.cookie.split('; ').find(x=>x.startsWith('CF_Authorization=')); if(!c) return null;
    const b=c.split('=')[1].split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); const j=JSON.parse(decodeURIComponent(escape(atob(b))));
    return j.email?{email:j.email,name:j.name||'',iat:j.iat}:null; }catch(e){ return null; }
}
if(location.protocol.startsWith('http')){
  fetch('/cdn-cgi/access/get-identity',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(j=>{
    const ck=cookieIdentity();
    if(j&&j.email) showProfile({email:j.email,name:j.name||'',iat:ck&&ck.iat}); else if(ck) showProfile(ck);
  }).catch(()=>{ const ck=cookieIdentity(); if(ck) showProfile(ck); });
}
function closeProfile(){ $('#profileMenu').hidden=true; $('#profileBtn').setAttribute('aria-expanded','false'); }
$('#profileBtn').addEventListener('click',e=>{ e.stopPropagation(); const open=$('#profileMenu').hidden; $('#profileMenu').hidden=!open; $('#profileBtn').setAttribute('aria-expanded',String(open)); });
document.addEventListener('click',e=>{ if(!$('#profileMenu').hidden&&!e.target.closest('#profileMenu')) closeProfile(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeProfile(); });
DATA=JSON.parse(document.getElementById('dados').textContent); route();
</script>
