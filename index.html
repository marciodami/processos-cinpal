<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processos Cinpal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de consulta — barra lateral com os processos por área, painel com abas por processo (fluxo, regras, RACI, SIPOC, dados, SAP) */
:root{
  --bg:#F2F3F5; --panel:#FFFFFF; --ink:#1E252C; --soft:#56616B; --line:#DDE1E5; --line2:#ECEEF1;
  --accent:#EE5A24; --accent-ink:#C2410C; --accent-tint:#FDEBE2;
  --brand-dark:#242A30; --brand-grad:linear-gradient(90deg,#F2402A 0%,#F7931E 100%);
  --steel:#2E4A5C; --steel-tint:#E3ECF1;
  --ok:#2F7D55; --ok-tint:#E2F2E8; --warn:#A86A12; --warn-tint:#FBF0DC; --muted:#7A868E; --muted-tint:#ECEEEE;
  --lane:#F7F8F6; --lane-head:#E9ECEA; --task:#FFFFFF; --task-line:#6E8592; --gate:#FFF6DC; --gate-line:#B98A1C;
  --start:#2F7D55; --end:#B23620;
  --f-display:'Archivo',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C21; --panel:#20262C; --ink:#E9EDF0; --soft:#A6B1BA; --line:#323B44; --line2:#283038;
  --accent:#FF6A2B; --accent-ink:#FF8A4C; --accent-tint:#3B2418;
  --steel:#8FB4CC; --steel-tint:#1F2F3A;
  --ok:#6CC495; --ok-tint:#1C3227; --warn:#E3AE55; --warn-tint:#352A16; --muted:#8C989F; --muted-tint:#263037;
  --lane:#1E272D; --lane-head:#26323A; --task:#222D34; --task-line:#7D97A6; --gate:#3A3220; --gate-line:#D6A83E;
  --start:#6CC495; --end:#FF8A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C21; --panel:#20262C; --ink:#E9EDF0; --soft:#A6B1BA; --line:#323B44; --line2:#283038;
  --accent:#FF6A2B; --accent-ink:#FF8A4C; --accent-tint:#3B2418;
  --steel:#8FB4CC; --steel-tint:#1F2F3A;
  --ok:#6CC495; --ok-tint:#1C3227; --warn:#E3AE55; --warn-tint:#352A16; --muted:#8C989F; --muted-tint:#263037;
  --lane:#1E272D; --lane-head:#26323A; --task:#222D34; --task-line:#7D97A6; --gate:#3A3220; --gate-line:#D6A83E;
  --start:#6CC495; --end:#FF8A74; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{--ink:#EEF1F3;--soft:#A9B3BB;--line:#3A444D;--line2:#313A42;--bg:#2C343C;--panel:#262D34;--accent-tint:rgba(255,106,43,.18);--accent-ink:#FF8A4C;--ok:#6CC495;--warn:#E3AE55;--muted:#8C989F;color:var(--ink);background:linear-gradient(180deg,rgba(36,42,48,.9),rgba(36,42,48,.97)),url(img/pattern.jpg) center top/520px repeat,#242A30;border-right:0;padding:22px 14px 0 max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.navs{display:flex;flex-direction:column;flex:1 0 auto}
.brand{display:flex;flex-direction:column;gap:10px;padding:2px 8px 18px;text-decoration:none}
.brand img{width:168px;height:auto;display:block}
.brand span{font:700 11.5px/1 var(--f-display);letter-spacing:2.2px;text-transform:uppercase;color:#FFFFFF;display:flex;align-items:center;gap:8px}
.brand span::before{content:'';width:18px;height:3px;border-radius:2px;background:var(--brand-grad)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.acc{border-top:1px solid var(--line2)}
.acc:last-child{border-bottom:1px solid var(--line2)}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:7px;font:700 13px/1.1 var(--f-display);letter-spacing:1.3px;text-transform:uppercase;color:var(--accent-ink);user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:var(--bg)}
.acc>summary .cnt{margin-left:auto;font:500 11.5px/1 var(--f-mono);letter-spacing:0;color:var(--accent-ink);background:var(--accent-tint);padding:3px 7px;border-radius:5px}
.acc>summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.acc[open]>summary::after{transform:rotate(45deg)}
.acc .nav{padding:0 0 10px}
.acc>summary .sig{font:700 11px/1 var(--f-mono);letter-spacing:.5px;color:#fff;background:var(--brand-grad);padding:4px 6px;border-radius:5px;min-width:44px;text-align:center}
.acc>summary .mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav .area{font:600 11px/1.2 var(--f-body);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px;list-style:none}
.nav .area:first-child{padding-top:2px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;text-decoration:none;font-size:14px;color:var(--ink)}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.muted{background:var(--muted)}
.nav a.pend{opacity:.62;font-style:italic}
.card.pend{border-style:dashed;background:transparent}
.card.pend h3{color:var(--soft)}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.checks li.on{border-color:transparent;background:var(--ok-tint);color:var(--ok)}
.checks li.on::before{content:'✓';font-weight:700}
.checks li:not(.on)::before{content:'○'}
.lines{margin:0;padding-left:18px}.lines li{margin:2px 0}
.lines .ln{font:600 12px var(--f-mono);color:var(--accent-ink)}
.home-link{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;text-decoration:none;font-weight:600;font-size:14px}
.home-link[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink)}
/* main */
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,clamp(16px,3vw,44px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,44px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent-ink)}
h1{font:800 clamp(28px,3.4vw,40px)/1.08 var(--f-display);letter-spacing:-.6px;margin:6px 0 0;text-wrap:balance}
h2{font:700 20px/1.2 var(--f-display);margin:0}
h3{font:700 16px/1.25 var(--f-display);margin:0}
.lede{font-size:16.5px;color:var(--soft);max-width:68ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--muted-tint);color:var(--soft)}
.pill.ok{background:var(--ok-tint);color:var(--ok)} .pill.warn{background:var(--warn-tint);color:var(--warn)} .pill.steel{background:var(--steel-tint);color:var(--steel)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-tint);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:12px 14px;font-size:14.5px}
.alert b{color:var(--warn)}
/* marca */
.hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;background:#E8582A url(img/hero.jpg) right top/cover no-repeat;padding:44px 40px 40px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,33,38,.42) 0%,rgba(28,33,38,.14) 55%,rgba(28,33,38,0) 80%);pointer-events:none}
.hero>*{position:relative;max-width:640px}
.hero .eyebrow{color:#fff;opacity:.92;display:flex;align-items:center;gap:10px}
.hero .eyebrow::before{content:'';width:22px;height:3px;background:#1E252C;border-radius:2px}
.hero h1{font-size:clamp(34px,5vw,56px);color:#fff;margin:0;letter-spacing:-1px}
.hero p{margin:0;font-size:16.5px;line-height:1.55;color:rgba(255,255,255,.94)}
.phead{position:relative;border-radius:18px;overflow:hidden;background:#242A30 url(img/gear.jpg) right center/auto 135% no-repeat;color:#F3F5F6;padding:30px 34px;display:flex;flex-direction:column;gap:12px}
.phead::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#242A30 0%,#242A30 48%,rgba(36,42,48,.6) 72%,rgba(36,42,48,0) 100%);pointer-events:none}
.phead>*{position:relative;max-width:720px}
.phead .eyebrow{color:#FF8A4C}
.phead h1{color:#fff}
.phead .lede{color:#C9D2D8}
.phead .pill{background:rgba(255,255,255,.1);color:#E4E9ED}
.phead .pill.ok{background:rgba(108,196,149,.18);color:#8FE0B4}
.phead .pill.warn{background:rgba(227,174,85,.2);color:#F2C67B}
.phead .pill.steel{background:rgba(143,180,204,.18);color:#B9D3E4}
.tip{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-right:18px}
.tip img{width:96px;height:112px;object-fit:cover;flex:none}
.tip b{display:block;font:700 16px/1.25 var(--f-display);margin-bottom:2px}
.tip p{margin:0;font-size:14px;color:var(--soft)}
.capa{display:block;width:100%;height:auto;border-radius:14px;aspect-ratio:1006/260;object-fit:cover}
.nav-empty{display:flex;gap:12px;align-items:center;padding:10px 8px;font-size:13.5px;color:var(--soft)}
.nav-empty img{width:44px;height:52px;object-fit:cover;border-radius:8px;flex:none}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--soft);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font:500 11.5px/1 var(--f-mono);color:var(--muted);background:var(--muted-tint);padding:3px 6px;border-radius:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
/* diagram */
.dg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.zoom{display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--panel);border-radius:7px;min-width:34px;height:32px;cursor:pointer;font-weight:600;padding:0 10px;font-size:13px}
.canvas{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:grab;max-height:72vh;touch-action:pan-x pan-y}
.canvas.drag{cursor:grabbing;user-select:none}
.canvas svg{display:block}
.canvas img{display:block;max-width:none;background:#fff}
.mod-h{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:18px;border-top:1px solid var(--line)}
.mod-h .sig{font:700 13px/1 var(--f-mono);color:#fff;background:var(--brand-grad);padding:6px 9px;border-radius:6px}
.mod-h h2{font-size:24px}
.area-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 -2px}
.area-h h3{font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--soft)}
.mod-nav{display:flex;flex-wrap:wrap;gap:8px}
.mod-nav a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;background:var(--panel)}
.mod-nav a:hover{border-color:var(--accent)}
.mod-nav a b{font:700 11.5px var(--f-mono);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--soft)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.lg{width:16px;height:12px;border:1.5px solid var(--task-line);border-radius:3px;background:var(--task)}
.lg.g{transform:rotate(45deg);width:10px;height:10px;border-radius:1px;background:var(--gate);border-color:var(--gate-line)}
.lg.s{border-radius:50%;width:12px;border-color:var(--start)} .lg.e{border-radius:50%;width:12px;border:3px solid var(--end)}
/* tables */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:10px}
.tbl-wrap.fit{overflow:visible;max-height:none}
.tbl-wrap.fit thead th:first-child{border-top-left-radius:10px}.tbl-wrap.fit thead th:last-child{border-top-right-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-weight:600;font-size:12.5px;letter-spacing:.3px;color:var(--soft);background:var(--bg);position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line)}
tr:last-child td{border-bottom:0}
.raci td.l{text-align:center;width:1%}
.raci th.a{text-align:center;min-width:92px;font-size:12px}
.L{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:600 13px/1 var(--f-mono)}
.L.R{background:var(--accent);color:#fff} .L.A{background:var(--ink);color:var(--panel)} .L.C{background:var(--steel-tint);color:var(--steel)} .L.I{background:var(--muted-tint);color:var(--muted)}
.step{font-variant-numeric:tabular-nums;color:var(--muted);font:500 12px var(--f-mono);width:1%;white-space:nowrap}
.sipoc th{font-family:var(--f-display);font-size:14px;color:var(--ink)}
.sipoc th small{display:block;font:500 11.5px var(--f-body);color:var(--soft)}
.sipoc td:nth-child(3){font-weight:600}
/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rule.wide{grid-column:1/-1}
.rule h3{font-size:14px;letter-spacing:.2px;color:var(--soft);font-family:var(--f-body);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:1.2px}
.rule ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.rule p{margin:0}
.rule.challenge{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rule.challenge h3{color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--soft)} .kv dd{margin:0}
details.file{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.file summary{cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
details.file summary::-webkit-details-marker{display:none}
details.file summary span{font-weight:400;color:var(--soft);font-size:13px}
details.file[open] summary{border-bottom:1px solid var(--line2)}
details.file .tbl-wrap{border:0;border-radius:0 0 10px 10px}
details.file .tbl-wrap.fit thead th{border-radius:0}
.sap{border-left:4px solid var(--steel);background:var(--steel-tint);border-radius:0 12px 12px 0;padding:18px 22px;font-size:16px;line-height:1.6;max-width:80ch}
.sap code,.mono{font:500 .9em var(--f-mono)}
.note{font-size:13px;color:var(--soft)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand-grad)}
.stat b{display:block;font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16.5px}
.card p{margin:0;font-size:13.5px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:10px;font:500 12px var(--f-mono);color:var(--muted);margin-top:auto}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.sec-h h2{display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:'';width:14px;height:14px;border-radius:4px;background:var(--brand-grad);flex:none}
.empty{padding:28px;text-align:center;color:var(--soft)}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top-actions{display:flex;gap:8px;align-items:center}
.profile-wrap{position:sticky;bottom:0;margin-top:auto;padding:14px 0 16px;background:var(--panel);border-top:1px solid var(--line);z-index:5}
.navs>#nav{margin-bottom:18px}
.profile-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left}
.profile-row:hover,.profile-row[aria-expanded="true"]{border-color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent-ink);font:700 14px/1 var(--f-display)}
.pr-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.pr-txt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-txt span{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-chev{width:7px;height:7px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(-135deg);margin:4px 4px 0 0;transition:transform .15s;flex:none}
.profile-row[aria-expanded="true"] .pr-chev{transform:rotate(45deg);margin:0 4px 4px 0}
.profile-menu{position:absolute;left:0;right:0;bottom:calc(100% - 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 -8px 28px rgba(0,0,0,.14);padding:14px;display:flex;flex-direction:column;gap:12px}
.profile-menu .mail-full{margin:0;font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.profile-menu .meta-line{margin:0;font-size:12.5px;color:var(--soft)}
.logout{display:flex;justify-content:center;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--ink);color:var(--panel);text-decoration:none;font-weight:600;font-size:14px}
.logout:hover{opacity:.9}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .side .navs{display:none}
  .side.open .navs{display:block}

function navHTML(filter){
  const f=(filter||'').toLowerCase();
  const cur=location.hash.slice(1);
  const match=p=>!f||JSON.stringify([p.titulo,p.grupo,p.modulo,p.conceito,p.keyuser,p.head,p.status,p.atores,p.raci.map(r=>r.etapa),p.tabelas.map(t=>t[2]),(p.andamento||[]).map(l=>l.nome),(p.dentro||[]).map(l=>l.nome)]).toLowerCase().includes(f);
  return MODULES.map(m=>{
    const items=DATA.filter(p=>p.modulo===m.sigla&&match(p));
    if(!items.length) return '';
    const open=!!f||items.some(p=>p.id===cur)||state.open.has(m.sigla);
    const multi=m.areas.filter(a=>items.some(p=>p.grupo===a)).length>1;
    const li=p=>`<li><a href="#${p.id}" ${p.pendente?'class="pend" title="Arquivos ainda não estão no site"':''} ${cur===p.id?'aria-current="page"':''}><i class="dot ${statusCls(p.status)==='ok'?'':statusCls(p.status)}"></i>${esc(p.titulo)}</a></li>`;
    const body=m.areas.map(a=>{const it=items.filter(p=>p.grupo===a); if(!it.length) return ''; return (multi?`<li class="area">${esc(a)}</li>`:'')+it.map(li).join('');}).join('');
    return `<details class="acc" data-g="${esc(m.sigla)}" ${open?'open':''}><summary><span class="sig">${esc(m.sigla)}</span><span class="mname" title="${esc(m.nome)}">${esc(m.curto||m.nome)}</span><span class="cnt">${items.length}</span></summary><ul class="nav">${body}</ul></details>`;
  }).join('')||'<div class="nav-empty"><img src="img/lupa.jpg" alt=""><span>Nenhum processo encontrado. Tente outra palavra.</span></div>';
}
function renderNav(){ $('#nav').innerHTML=navHTML($('#q').value); document.querySelectorAll('#nav .acc').forEach(d=>d.addEventListener('toggle',()=>{ if($('#q').value) return; d.open?state.open.add(d.dataset.g):state.open.delete(d.dataset.g); })); $('#homeLink').toggleAttribute('aria-current',!location.hash||location.hash==='#inicio'); if($('#homeLink').hasAttribute('aria-current')) $('#homeLink').setAttribute('aria-current','page'); }

    :`<a class="card" href="#${p.id}"><div class="meta"><span class="pill ${statusCls(p.status)}">${esc(p.status)}</span></div><h3>${esc(p.titulo)}</h3><p>${esc(p.conceito||'Conceito não preenchido no mapeamento.')}</p><div class="foot"><span>${nFlows(p)} fluxo${nFlows(p)===1?'':'s'}</span><span>${p.raci.length} etapas</span><span>${p.tabelas.length} campos</span></div></a>`;

    <div class="stat"><b>${ANDAMENTO['Em andamento']||0}</b><span>em andamento</span></div>

  </div>
  <nav class="mod-nav" aria-label="Módulos">${MODULES.map(m=>{const n=DATA.filter(p=>p.modulo===m.sigla).length; return n?`<a href="#mod-${m.sigla.replace('/','')}" data-jump="mod-${m.sigla.replace('/','')}"><b>${esc(m.sigla)}</b>${esc(m.nome)} <span class="note">${n}</span></a>`:'';}).join('')}</nav>
  <div class="tip"><img src="img/lupa.jpg" alt="" width="300" height="353"><div><b>Procure qualquer processo</b><p>A busca do menu encontra pelo nome do processo, pela área, por quem participa ou por um campo de dados, como “OM”, “rebate” ou “centro de custo”.</p></div></div>

/* ---------- diagram ---------- */
function wrapText(t,maxCh){
  const words=String(t).split(/\s+/).filter(Boolean), out=[]; let cur='';
  for(const w of words){ if((cur+' '+w).trim().length>maxCh&&cur){out.push(cur);cur=w;} else cur=(cur+' '+w).trim(); }
  if(cur) out.push(cur); return out;
}
function textBlock(t,cx,cy,w,h,fs,anchorTop){
  const cw=fs*0.56; let size=fs, maxCh=Math.max(6,Math.floor((w-8)/cw)), L=wrapText(t,maxCh);
  if(!anchorTop){ while(L.length*size*1.15>h-6&&size>7){size-=0.5; maxCh=Math.max(6,Math.floor((w-6)/(size*0.56))); L=wrapText(t,maxCh);} }
  const lh=size*1.15, y0=anchorTop?cy+size:cy-(L.length-1)*lh/2+size*0.35;
  return `<text font-size="${size}" text-anchor="middle" fill="var(--ink)">${L.map((l,i)=>`<tspan x="${cx}" y="${(y0+i*lh).toFixed(1)}">${esc(l)}</tspan>`).join('')}</text>`;
}
function drawDiagram(d){
  const xs=[],ys=[];
  const add=(x,y,w,h)=>{xs.push(x,x+(w||0));ys.push(y,y+(h||0));};
  add(d.pool.x,d.pool.y,d.pool.w,d.pool.h); d.lanes.forEach(l=>add(l.x,l.y,l.w,l.h)); d.nodes.forEach(n=>add(n.x,n.y,n.w,n.h+(n.k==='task'||n.k==='sub'?0:40))); d.arts.forEach(a=>add(a.x,a.y,a.w,a.h+30)); d.edges.forEach(e=>e.p.forEach(p=>add(p[0],p[1])));
  const minX=Math.min(...xs)-20, minY=Math.min(...ys)-20, W=Math.max(...xs)-minX+20, H=Math.max(...ys)-minY+20;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${W} ${H}" width="${W}" height="${H}" font-family="IBM Plex Sans, system-ui, sans-serif" role="img" aria-label="Fluxo ${esc(d.nome)}">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--soft)"/></marker></defs>`;
  const laneX=d.lanes.length?Math.min(...d.lanes.map(l=>l.x)):d.pool.x;
  s+=`<rect x="${d.pool.x}" y="${d.pool.y}" width="${d.pool.w}" height="${d.pool.h}" fill="var(--lane)" stroke="var(--line)" />`;
  if(laneX>d.pool.x){ s+=`<rect x="${d.pool.x}" y="${d.pool.y}" width="${laneX-d.pool.x}" height="${d.pool.h}" fill="var(--lane-head)" stroke="var(--line)"/>`;
    const cx=d.pool.x+(laneX-d.pool.x)/2, cy=d.pool.y+d.pool.h/2; s+=`<text transform="translate(${cx+4} ${cy}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${esc(d.nome).slice(0,90)}</text>`; }
  d.lanes.forEach(l=>{ s+=`<rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" fill="none" stroke="var(--line)"/><rect x="${l.x}" y="${l.y}" width="26" height="${l.h}" fill="var(--lane-head)" stroke="var(--line)"/>`;
    const L=wrapText(l.t,Math.max(8,Math.floor((l.h-10)/6.2))).slice(0,2), cx=l.x+13, cy=l.y+l.h/2;
    s+=`<text transform="translate(${cx} ${cy}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${L.map((t,i)=>`<tspan x="0" y="${(i-(L.length-1)/2)*12+4}">${esc(t)}</tspan>`).join('')}</text>`; });
  d.edges.forEach(e=>{ const pts=e.p.map(p=>p.join(',')).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="var(--soft)" stroke-width="1.3" marker-end="url(#ar)"/>`;
    if(e.t){ let best=0,bi=0; for(let i=0;i<e.p.length-1;i++){const dl=Math.hypot(e.p[i+1][0]-e.p[i][0],e.p[i+1][1]-e.p[i][1]); if(dl>best){best=dl;bi=i;}}
      const a=e.p[bi],b=e.p[bi+1], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, horiz=Math.abs(b[1]-a[1])<2;
      s+=`<text x="${horiz?mx:mx+6}" y="${horiz?my-5:my}" font-size="10" font-weight="600" fill="var(--accent-ink)" text-anchor="${horiz?'middle':'start'}">${esc(e.t)}</text>`; } });
  d.arts.forEach(a=>{
    if(a.k==='Annotation'){ s+=`<path d="M${a.x+10} ${a.y}H${a.x}V${a.y+a.h}H${a.x+10}" fill="none" stroke="var(--muted)"/>`;
      const L=wrapText(a.t,Math.max(10,Math.floor((a.w-8)/5))).slice(0,Math.max(1,Math.floor(a.h/11))); s+=`<text font-size="9.5" fill="var(--soft)">${L.map((t,i)=>`<tspan x="${a.x+5}" y="${a.y+11+i*11}">${esc(t)}</tspan>`).join('')}</text>`; }
    else if(a.k==='store'){ const x=a.x,y=a.y,w=a.w,h=a.h; s+=`<path d="M${x} ${y+6}C${x} ${y-2} ${x+w} ${y-2} ${x+w} ${y+6}V${y+h-6}C${x+w} ${y+h+2} ${x} ${y+h+2} ${x} ${y+h-6}Z M${x} ${y+6}C${x} ${y+14} ${x+w} ${y+14} ${x+w} ${y+6}" fill="var(--task)" stroke="var(--task-line)"/>`+(a.t?textBlock(a.t,x+w/2,y+h+2,130,40,9.5,true):''); }
    else if(a.k==='DataObject'){ const x=a.x,y=a.y,w=a.w,h=a.h; s+=`<path d="M${x} ${y}H${x+w-10}L${x+w} ${y+10}V${y+h}H${x}Z" fill="var(--task)" stroke="var(--task-line)"/>`+(a.t?textBlock(a.t,x+w/2,y+h+2,130,40,9.5,true):''); }
  });
  d.nodes.forEach(n=>{ const cx=n.x+n.w/2, cy=n.y+n.h/2;
    if(n.k==='task'||n.k==='sub'){ s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="var(--task)" stroke="var(--task-line)" stroke-width="1.2"/>`+textBlock(n.t,cx,cy-(n.k==='sub'?4:0),n.w,n.h-(n.k==='sub'?10:0),10);
      if(n.k==='sub') s+=`<rect x="${cx-5}" y="${n.y+n.h-12}" width="10" height="10" fill="none" stroke="var(--task-line)"/><path d="M${cx-3} ${n.y+n.h-7}h6M${cx} ${n.y+n.h-10}v6" stroke="var(--task-line)"/>`; }
    else if(n.k==='gateway'){ s+=`<path d="M${cx} ${n.y}L${n.x+n.w} ${cy}L${cx} ${n.y+n.h}L${n.x} ${cy}Z" fill="var(--gate)" stroke="var(--gate-line)" stroke-width="1.3"/><path d="M${cx-7} ${cy-7}L${cx+7} ${cy+7}M${cx+7} ${cy-7}L${cx-7} ${cy+7}" stroke="var(--gate-line)" stroke-width="2"/>`;
      if(n.t) s+=textBlock(n.t,cx,n.y+n.h+2,130,40,9.5,true); }
    else { const r=n.w/2, col=n.k==='start'?'var(--start)':(n.k==='end'?'var(--end)':'var(--steel)'), sw=n.k==='end'?3.5:1.6;
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--task)" stroke="${col}" stroke-width="${sw}"/>`+(n.k==='inter'?`<circle cx="${cx}" cy="${cy}" r="${r-3}" fill="none" stroke="${col}" stroke-width="1.2"/>`:'');
      if(n.t) s+=textBlock(n.t,cx,n.y+n.h+2,120,40,9.5,true); }
  });
  return {svg:s+'</svg>',W,H};
}

function flowTab(p){
  const imgs=p.imagens||[];
  if(!p.diagramas.length&&!imgs.length) return `<div class="panel empty">Este processo ainda não tem fluxo desenhado.</div>`;
  const list=p.diagramas.length?p.diagramas:imgs.map((x,k)=>({nome:imgs.length>1?'Fluxo '+(k+1):'Fluxo AS-IS'}));
  const i=Math.min(state.diag[p.id]||0,list.length-1), d=list[i];
  const chips=list.length>1?`<div class="chips" role="group" aria-label="Fluxos do processo">${list.map((x,k)=>`<button class="chip" data-diag="${k}" aria-pressed="${k===i}">${esc(x.nome)}</button>`).join('')}</div>`:`<h3>${esc(d.nome)}</h3>`;
  const legend=p.diagramas.length?`<div class="legend"><span><i class="lg"></i>Atividade</span><span><i class="lg g"></i>Decisão</span><span><i class="lg s"></i>Início</span><span><i class="lg e"></i>Fim</span><span>Faixas = quem executa · arraste para navegar</span></div>`:`<p class="note">Imagem do fluxo colada no mapeamento da área (não veio o arquivo do Bizagi). Use o zoom e arraste para navegar.</p>`;
  return `<div class="stack"><div class="dg-bar">${chips}<div class="zoom"><button data-z="-" aria-label="Diminuir zoom">−</button><button data-z="fit">Ajustar</button><button data-z="+" aria-label="Aumentar zoom">+</button></div></div>
  <div class="canvas" id="canvas"></div>${legend}</div>`;
}
function fitTables(){
  document.querySelectorAll('.tbl-wrap').forEach(w=>{ w.classList.remove('fit'); if(w.offsetParent&&w.scrollWidth<=w.clientWidth+1) w.classList.add('fit'); });
}
addEventListener('resize',()=>{clearTimeout(fitTables.t); fitTables.t=setTimeout(fitTables,150);});
document.addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.file')) fitTables(); },true);
function mountFlow(p){
  const c=$('#canvas'); if(!c) return;
  const imgs=p.imagens||[]; let r, el;
  if(p.diagramas.length){ const i=Math.min(state.diag[p.id]||0,p.diagramas.length-1); r=drawDiagram(p.diagramas[i]); c.innerHTML=r.svg; el=c.querySelector('svg'); r.key=p.id+':'+i; }
  else { const i=Math.min(state.diag[p.id]||0,imgs.length-1), im=imgs[i]; r={W:im.w,H:im.h,key:p.id+':img'+i}; c.innerHTML=`<img src="${im.src}" alt="Fluxo do processo ${esc(p.titulo)}" width="${im.w}" height="${im.h}" draggable="false">`; el=c.querySelector('img'); }
  const fit=()=>Math.min(1.2,Math.max(p.diagramas.length?0.6:0.3,(c.clientWidth-2)/r.W));
  const key=r.key; if(state.zoom[key]==null) state.zoom[key]=fit();
  const apply=()=>{ const z=state.zoom[key]; el.setAttribute('width',Math.round(r.W*z)); el.setAttribute('height',Math.round(r.H*z)); };
  apply();
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const v=b.dataset.z; state.zoom[key]=v==='fit'?fit():Math.min(2.5,Math.max(0.15,state.zoom[key]*(v==='+'?1.2:1/1.2))); apply(); });
  let sx,sy,sl,st,down=false;
  c.onpointerdown=e=>{ if(e.pointerType!=='mouse') return; down=true; sx=e.clientX; sy=e.clientY; sl=c.scrollLeft; st=c.scrollTop; c.classList.add('drag'); };
  window.onpointermove=e=>{ if(!down) return; c.scrollLeft=sl-(e.clientX-sx); c.scrollTop=st-(e.clientY-sy); };
  window.onpointerup=()=>{ down=false; c.classList.remove('drag'); };
}
function rulesTab(p){
  const entries=Object.entries(p.regras).filter(([k])=>!/^Processo$/i.test(k));
  const lab=k=>{for(const [re,l] of RULE_LABEL) if(re.test(k.trim())) return l; return k.replace(/\s+/g,' ');};
  const cards=entries.map(([k,v])=>{ const L=lines(v), l=lab(k), wide=/Crit|Desafio/.test(l);
    return `<div class="rule ${wide?'wide':''} ${/Desafio/.test(l)?'challenge':''}"><h3>${esc(l)}</h3>${L.length>1?`<ul>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(L[0]||'')}</p>`}</div>`;}).join('');
  const kv=`<div class="panel"><dl class="kv">
    <dt>Conceito</dt><dd>${esc(p.conceito||'—')}</dd>
    ${p.sub?`<dt>Subprocessos</dt><dd>${esc(p.sub)}</dd>`:''}
    <dt>Onde fica hoje</dt><dd>${esc(lines(p.armazenamento).join(' · ')||'—')}</dd>
    ${p.head?`<dt>Head responsável</dt><dd>${esc(p.head)}</dd>`:''}
    ${p.keyuser?`<dt>Key user</dt><dd>${esc(p.keyuser)}</dd>`:''}
    <dt>Andamento oficial</dt><dd>${(p.andamento||[]).length?`<ul class="lines">${p.andamento.map(l=>`<li><span class="ln">linha ${l.linha}</span> ${esc(l.nome)} · ${esc(l.status)}</li>`).join('')}</ul>`:'Não está na planilha de andamento dos processos críticos.'}</dd>
    ${(p.dentro||[]).length?`<dt>Também neste fluxo</dt><dd><ul class="lines">${p.dentro.map(l=>`<li><span class="ln">linha ${l.linha}</span> ${esc(l.nome)} · ${esc(l.status)}</li>`).join('')}</ul></dd>`:''}
    ${p.conclusao?`<dt>Concluído em</dt><dd>${esc(p.conclusao)}</dd>`:''}
    ${p.entregas?`<dt>Entregas no andamento</dt><dd>${checks(p.entregas)}</dd>`:''}
    ${p.arquivo?`<dt>Planilha de origem</dt><dd>${esc(p.arquivo)}</dd>`:''}
    ${(p.falta||[]).length?`<dt>Falta no mapeamento</dt><dd>${esc(p.falta.join(', '))}</dd>`:''}
    ${p.pdfs.length?`<dt>PDFs no pacote</dt><dd>${esc(p.pdfs.join(' · '))}</dd>`:''}
  </dl></div>`;
  return `<div class="stack">${kv}${entries.length?`<div class="rules">${cards}</div>`:`<div class="panel empty">Regras de negócio não preenchidas.</div>`}</div>`;
}
function raciTab(p){
  if(!p.raci.length) return `<div class="panel empty">RACI não preenchido.</div>`;
  const L=v=>{const t=String(v).toUpperCase().replace(/[^RACI\/,]/g,''); return t?t.split(/[\/,]/).filter(Boolean).map(x=>`<span class="L ${x}" title="${({R:'Responsável (executa)',A:'Aprova',C:'Consultado',I:'Informado'})[x]||''}">${x}</span>`).join(' '):'';};
  return `<div class="stack"><p class="note"><span class="L R">R</span> executa · <span class="L A">A</span> aprova · <span class="L C">C</span> é consultado · <span class="L I">I</span> é informado</p>
  <div class="tbl-wrap"><table class="raci"><thead><tr><th>#</th><th>Etapa</th>${p.atores.map(a=>`<th class="a">${esc(a)}</th>`).join('')}</tr></thead><tbody>
  ${p.raci.map((r,i)=>`<tr><td class="step">${String(i+1).padStart(2,'0')}</td><td>${esc(r.etapa)}</td>${p.atores.map((a,k)=>`<td class="l">${L(r.r[k]||'')}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>`;
}
function sipocTab(p){
  if(!p.sipoc.length) return `<div class="panel empty">SIPOC não preenchido.</div>`;
  const H=[['S','Fornecedores'],['I','Entradas'],['P','Processo'],['O','Saídas'],['C','Clientes']];
  return `<div class="tbl-wrap"><table class="sipoc"><thead><tr>${H.map(h=>`<th>${h[0]}<small>${h[1]}</small></th>`).join('')}</tr></thead><tbody>${p.sipoc.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function dataTab(p){
  if(!p.tabelas.length) return `<div class="panel empty">Nenhum dado levantado neste mapeamento.</div>`;
  const byFile=new Map(); p.tabelas.forEach(t=>{const k=t[0]||'Sem nome'; if(!byFile.has(k)) byFile.set(k,{st:t[1],rows:[]}); byFile.get(k).rows.push(t);});
  return `<div class="stack"><p class="note">${byFile.size} arquivos ou registros usados hoje, com ${p.tabelas.length} campos. É a base para planejar a carga de dados no SAP.</p>
  ${[...byFile].map(([f,o],i)=>`<details class="file" ${i===0?'open':''}><summary>${esc(f)}<span>${o.rows.length} campos${o.st?' · '+esc(o.st):''}</span></summary><div class="tbl-wrap"><table><thead><tr><th>Campo</th><th>O que é</th></tr></thead><tbody>${o.rows.map(r=>`<tr><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}</div>`;
}
function sapTab(p){
  const txt=esc(p.sap).replace(/\b([A-Z]{2,4}\d{2,3}[A-Z]?)\b/g,'<code>$1</code>');
  return `<div class="stack"><div class="sap">${txt}</div><p class="note">${isQMPM(p)?'Recomendação do Head do módulo pelo padrão SAP (best practices). É ponto de partida para o workshop de fit-to-standard e pode mudar no Explore.':'Sugestão inicial pelo padrão SAP (best practices), a validar pelo Head de '+esc(p.modulo)+' e pela consultoria no Explore.'}</p></div>`;
}
const TABS=[['fluxo','Fluxo',p=>nFlows(p)],['regras','Regras',p=>Object.keys(p.regras).length],['raci','RACI',p=>p.raci.length],['sipoc','SIPOC',p=>p.sipoc.length],['dados','Dados',p=>p.tabelas.length],['sap','No SAP',()=>null]];
function pendPage(p){
  const l=p.andamento[0];
  const msg=p.status==='Concluído'?'Este mapeamento consta como concluído na planilha de andamento, mas os arquivos (fluxo do Bizagi e planilha Excel) ainda não estão na pasta de mapeamentos. Assim que chegarem, ele aparece aqui completo.':(p.status==='Em andamento'?'Este mapeamento está em andamento. Assim que a área concluir e enviar os arquivos, ele aparece aqui completo.':'Este mapeamento ainda não começou.');
  return `<section class="phead"><p class="eyebrow">${esc(p.modulo)}${p.grupo!==p.modulo?' · '+esc(p.grupo):''}</p><h1>${esc(p.titulo)}</h1>
  <div class="meta"><span class="pill ${statusCls(p.status)}">${esc(p.status)}</span><span class="pill steel">Linha ${l.linha} do andamento</span></div></section>
  <div class="stack"><div class="panel"><p style="margin:0 0 14px">${msg}</p><dl class="kv">
    ${p.head?`<dt>Head responsável</dt><dd>${esc(p.head)}</dd>`:''}
    ${p.keyuser?`<dt>Key user</dt><dd>${esc(p.keyuser)}</dd>`:''}
    ${p.conclusao?`<dt>Concluído em</dt><dd>${esc(p.conclusao)}</dd>`:''}
    <dt>Entregas no andamento</dt><dd>${checks(p.entregas)}</dd>
  </dl></div></div>`;
}
function checks(e){ return e?`<ul class="checks">${ENTREGAS.map((n,k)=>`<li class="${e[k]?'on':''}">${esc(n)}</li>`).join('')}</ul>`:'—'; }
function proc(p){
  if(p.pendente) return pendPage(p);
  const tab=state.tab[p.id]||(nFlows(p)?'fluxo':'regras');
  const body={fluxo:flowTab,regras:rulesTab,raci:raciTab,sipoc:sipocTab,dados:dataTab,sap:sapTab}[tab](p);
  return `<section class="phead"><p class="eyebrow">${esc(p.modulo)}${p.grupo!==p.modulo?' · '+esc(p.grupo):''}${p.keyuser?' · key user '+esc(p.keyuser):''}</p><h1>${esc(p.titulo)}</h1>
  <div class="meta"><span class="pill ${statusCls(p.status)}">${esc(p.status)}</span>${p.diagramas.length?`<span class="pill steel">${p.diagramas.length} fluxo${p.diagramas.length>1?'s':''} no Bizagi</span>`:((p.imagens||[]).length?`<span class="pill steel">Fluxo em imagem</span>`:'')}</div>
  ${p.conceito?`<p class="lede">${esc(p.conceito)}</p>`:''}</section>
  ${ALERTS[p.id]?`<div class="alert"><b>Atenção</b><span>${esc(ALERTS[p.id])}</span></div>`:''}
  ${(p.avisos||[]).map(a=>`<div class="alert"><b>Atenção</b><span>${esc(a)}</span></div>`).join('')}
  <div class="tabs" role="tablist">${TABS.map(([k,l,c])=>{const n=c(p);return `<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`;}).join('')}</div>
  <div role="tabpanel">${body}</div>`;
}
function route(){
  const id=location.hash.slice(1); const p=DATA.find(x=>x.id===id);
  $('#view').innerHTML=p?proc(p):home();
  renderNav();
  if(p){
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab[p.id]=b.dataset.tab; try{localStorage.setItem('tab',b.dataset.tab)}catch(e){} rerender(p);});
    document.querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>{state.diag[p.id]=+b.dataset.diag; rerender(p);});
    mountFlow(p); fitTables();
  }
  document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault(); const t=document.getElementById(a.dataset.jump); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});});
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
}
function rerender(p){ const y=window.scrollY; route(); window.scrollTo(0,y); }
window.addEventListener('hashchange',()=>{route(); window.scrollTo(0,0);});
$('#q').addEventListener('input',renderNav);
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded',o);});
/* perfil (Cloudflare Access) */
function initials(name,email){ const src=(name||'').trim()||(email||'').split('@')[0]; const parts=src.split(/[\s._-]+/).filter(Boolean); return ((parts[0]||'?')[0]+((parts[1]||'')[0]||'')).toUpperCase(); }
function showProfile(id){
  const email=id.email||'', name=id.name||'';
  const ini=initials(name,email);
  $('#pmAvatar').textContent=ini; $('#pmEmailShort').textContent=email;
  $('#pmName').textContent=name||email.split('@')[0]||'Usuário'; $('#pmEmail').textContent=email;
  if(id.iat){ try{ $('#pmMeta').textContent='Conectado desde '+new Date(id.iat*1000).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'.'; }catch(e){} }
  $('#profileWrap').hidden=false;
}
function cookieIdentity(){
  try{ const c=document.cookie.split('; ').find(x=>x.startsWith('CF_Authorization=')); if(!c) return null;
    const b=c.split('=')[1].split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); const j=JSON.parse(decodeURIComponent(escape(atob(b))));
    return j.email?{email:j.email,name:j.name||'',iat:j.iat}:null; }catch(e){ return null; }
}
if(location.protocol.startsWith('http')){
  fetch('/cdn-cgi/access/get-identity',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(j=>{
    const ck=cookieIdentity();
    if(j&&j.email) showProfile({email:j.email,name:j.name||'',iat:ck&&ck.iat}); else if(ck) showProfile(ck);
  }).catch(()=>{ const ck=cookieIdentity(); if(ck) showProfile(ck); });
}
function closeProfile(){ $('#profileMenu').hidden=true; $('#profileBtn').setAttribute('aria-expanded','false'); }
$('#profileBtn').addEventListener('click',e=>{ e.stopPropagation(); const open=$('#profileMenu').hidden; $('#profileMenu').hidden=!open; $('#profileBtn').setAttribute('aria-expanded',String(open)); });
document.addEventListener('click',e=>{ if(!$('#profileMenu').hidden&&!e.target.closest('#profileWrap')) closeProfile(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeProfile(); });
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d; route();}).catch(()=>{$('#view').innerHTML='<div class="panel empty">Não foi possível carregar os dados dos processos. Recarregue a página.</div>';});
</script>

</body>
