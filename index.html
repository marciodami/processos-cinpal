<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processos Cinpal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de consulta — barra lateral com os processos por área, painel com abas por processo (fluxo, regras, RACI, SIPOC, dados, SAP) */
:root{
  --bg:#F3F4F2; --panel:#FFFFFF; --ink:#1A2329; --soft:#55626B; --line:#DCE0DD; --line2:#ECEEEC;
  --accent:#D9442B; --accent-ink:#B23620; --accent-tint:#FBE9E4;
  --steel:#2E4A5C; --steel-tint:#E3ECF1;
  --ok:#2F7D55; --ok-tint:#E2F2E8; --warn:#A86A12; --warn-tint:#FBF0DC; --muted:#7A868E; --muted-tint:#ECEEEE;
  --lane:#F7F8F6; --lane-head:#E9ECEA; --task:#FFFFFF; --task-line:#6E8592; --gate:#FFF6DC; --gate-line:#B98A1C;
  --start:#2F7D55; --end:#B23620;
  --f-display:'Archivo',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181C; --panel:#1A2228; --ink:#E6EBEE; --soft:#A3B0B8; --line:#2E3A42; --line2:#243038;
  --accent:#F0674F; --accent-ink:#FF8A74; --accent-tint:#3A221D;
  --steel:#8FB4CC; --steel-tint:#1F2F3A;
  --ok:#6CC495; --ok-tint:#1C3227; --warn:#E3AE55; --warn-tint:#352A16; --muted:#8C989F; --muted-tint:#263037;
  --lane:#1E272D; --lane-head:#26323A; --task:#222D34; --task-line:#7D97A6; --gate:#3A3220; --gate-line:#D6A83E;
  --start:#6CC495; --end:#FF8A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181C; --panel:#1A2228; --ink:#E6EBEE; --soft:#A3B0B8; --line:#2E3A42; --line2:#243038;
  --accent:#F0674F; --accent-ink:#FF8A74; --accent-tint:#3A221D;
  --steel:#8FB4CC; --steel-tint:#1F2F3A;
  --ok:#6CC495; --ok-tint:#1C3227; --warn:#E3AE55; --warn-tint:#352A16; --muted:#8C989F; --muted-tint:#263037;
  --lane:#1E272D; --lane-head:#26323A; --task:#222D34; --task-line:#7D97A6; --gate:#3A3220; --gate-line:#D6A83E;
  --start:#6CC495; --end:#FF8A74; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px 28px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 16px;text-decoration:none}
.brand b{font:800 20px/1.1 var(--f-display);letter-spacing:-.2px}
.brand span{font-size:12.5px;color:var(--soft)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.acc{border-top:1px solid var(--line2)}
.acc:last-child{border-bottom:1px solid var(--line2)}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:7px;font:700 13px/1.1 var(--f-display);letter-spacing:1.3px;text-transform:uppercase;color:var(--accent-ink);user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:var(--bg)}
.acc>summary .cnt{margin-left:auto;font:500 11.5px/1 var(--f-mono);letter-spacing:0;color:var(--accent-ink);background:var(--accent-tint);padding:3px 7px;border-radius:5px}
.acc>summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.acc[open]>summary::after{transform:rotate(45deg)}
.acc .nav{padding:0 0 10px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;text-decoration:none;font-size:14px;color:var(--ink)}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.muted{background:var(--muted)}
.home-link{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;text-decoration:none;font-weight:600;font-size:14px}
.home-link[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink)}
/* main */
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,clamp(16px,3vw,44px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,44px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:1.6px;text-transform:uppercase;color:var(--accent-ink)}
h1{font:800 clamp(28px,3.4vw,40px)/1.08 var(--f-display);letter-spacing:-.6px;margin:6px 0 0;text-wrap:balance}
h2{font:700 20px/1.2 var(--f-display);margin:0}
h3{font:700 16px/1.25 var(--f-display);margin:0}
.lede{font-size:16.5px;color:var(--soft);max-width:68ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--muted-tint);color:var(--soft)}
.pill.ok{background:var(--ok-tint);color:var(--ok)} .pill.warn{background:var(--warn-tint);color:var(--warn)} .pill.steel{background:var(--steel-tint);color:var(--steel)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-tint);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:12px 14px;font-size:14.5px}
.alert b{color:var(--warn)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--soft);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font:500 11.5px/1 var(--f-mono);color:var(--muted);background:var(--muted-tint);padding:3px 6px;border-radius:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
/* diagram */
.dg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.zoom{display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--panel);border-radius:7px;min-width:34px;height:32px;cursor:pointer;font-weight:600;padding:0 10px;font-size:13px}
.canvas{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:grab;max-height:72vh;touch-action:pan-x pan-y}
.canvas.drag{cursor:grabbing;user-select:none}
.canvas svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--soft)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.lg{width:16px;height:12px;border:1.5px solid var(--task-line);border-radius:3px;background:var(--task)}
.lg.g{transform:rotate(45deg);width:10px;height:10px;border-radius:1px;background:var(--gate);border-color:var(--gate-line)}
.lg.s{border-radius:50%;width:12px;border-color:var(--start)} .lg.e{border-radius:50%;width:12px;border:3px solid var(--end)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-weight:600;font-size:12.5px;letter-spacing:.3px;color:var(--soft);background:var(--bg);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.raci td.l{text-align:center;width:1%}
.raci th.a{text-align:center;min-width:92px;font-size:12px}
.L{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:600 13px/1 var(--f-mono)}
.L.R{background:var(--accent);color:#fff} .L.A{background:var(--ink);color:var(--panel)} .L.C{background:var(--steel-tint);color:var(--steel)} .L.I{background:var(--muted-tint);color:var(--muted)}
.step{font-variant-numeric:tabular-nums;color:var(--muted);font:500 12px var(--f-mono);width:1%;white-space:nowrap}
.sipoc th{font-family:var(--f-display);font-size:14px;color:var(--ink)}
.sipoc th small{display:block;font:500 11.5px var(--f-body);color:var(--soft)}
.sipoc td:nth-child(3){font-weight:600}
/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rule.wide{grid-column:1/-1}
.rule h3{font-size:14px;letter-spacing:.2px;color:var(--soft);font-family:var(--f-body);font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:1.2px}
.rule ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.rule p{margin:0}
.rule.challenge{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rule.challenge h3{color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--soft)} .kv dd{margin:0}
details.file{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.file summary{cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
details.file summary::-webkit-details-marker{display:none}
details.file summary span{font-weight:400;color:var(--soft);font-size:13px}
details.file[open] summary{border-bottom:1px solid var(--line2)}
details.file .tbl-wrap{border:0;border-radius:0 0 10px 10px}
.sap{border-left:4px solid var(--steel);background:var(--steel-tint);border-radius:0 12px 12px 0;padding:18px 22px;font-size:16px;line-height:1.6;max-width:80ch}
.sap code,.mono{font:500 .9em var(--f-mono)}
.note{font-size:13px;color:var(--soft)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16.5px}
.card p{margin:0;font-size:13.5px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:10px;font:500 12px var(--f-mono);color:var(--muted);margin-top:auto}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--soft)}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top-actions{display:flex;gap:8px;align-items:center;position:relative}
.profile-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--accent-tint);color:var(--accent-ink);font:700 14px/1 var(--f-display);cursor:pointer;display:grid;place-items:center;flex:none}
.profile-btn:hover{border-color:var(--accent)}
.profile-menu{position:absolute;top:46px;right:0;z-index:30;width:min(280px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:14px;display:flex;flex-direction:column;gap:12px}
.profile-menu .who{display:flex;gap:12px;align-items:center;min-width:0}
.profile-menu .who .avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent-ink);font:700 15px/1 var(--f-display);border:1px solid var(--line)}
.profile-menu .who div{min-width:0}
.profile-menu .who b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-menu .who .mail{display:block;font-size:12.5px;color:var(--soft);overflow-wrap:anywhere}
.profile-menu .meta-line{font-size:12.5px;color:var(--soft);border-top:1px solid var(--line2);padding-top:10px}
.logout{display:flex;justify-content:center;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--ink);color:var(--panel);text-decoration:none;font-weight:600;font-size:14px}
.logout:hover{opacity:.9}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .side .navs{display:none}
  .side.open .navs{display:block}
  .menu-btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;height:38px;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}
  .topline{margin-bottom:10px}
  .side{position:relative;z-index:20;overflow:visible}
  .brand{padding-bottom:4px}
  .kv{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

o Construc./Equip., MAN/Volks, CUMMINS."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Critério / Norma","Texto com filtro – norma ou tema auditado. Ex.: Heat Treatment, Forging, Machining, SMA (Peça de Segurança), PPAP/APQP (Mangas e Braços), SEM (Volvo CE), VDA 6.3 e 6.5."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Nota atingida","Número (% ou nota do cliente) – resultado da auditoria. Ex.: 59,8%; 51,0%; 'Nota 2 (RED)'; 85/86. Formato muda conforme o cliente (%, nota 1–3 com cor, pontos VDA)."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Meta (Aprovação)","Número – nota mínima exigida pelo cliente para aprovar. Ex.: 60,0%; 70,0%; 80,0%; 85; 'Nota 3 (YELLOW)'."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Resultado","Lista – Aprovado / Aprovado Condicional / Reprovado."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Porcentagem concluído (Ações)","Percentual – quanto do plano de ações do cliente já foi concluído. Ex.: 100,0%; 73,1%; 33,3% (digitado à mão ou calculado – confirmar)."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Followup","Data – data do próximo acompanhamento/prazo com o cliente. Ex.: 27/04/2026; 17/07/2026; 30/09/2026."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Obs.","Texto livre – situação atual. Ex.: 'Volvo está avaliando ações concluídas para revisão da nota'; 'Prazo final para conclusão, segundo cliente, 24/04/26 (Dayvid)'; nota por planta/área (Forjaria 85-B, Fundição 86-B, Usinagem 85-B)."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Pontos Críticos","Texto livre – ações ou temas que travam a aprovação, com área responsável entre parênteses. Ex.: 'Implantação da MMC Duramax (Qualidade Usinagem)'; 'Gestão de reclamações (8Ds)'; 'MSA, FIFO, 5S'; N/A."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","Cor da linha (status visual)","Formatação manual ou condicional – amarelo = em andamento/condicional, vermelho = reprovado com ações atrasadas, verde = aprovado (confirmar regra)."],["Excel Planos de Ações de Auditorias de Clientes (painel de acompanhamento)","Diretório Q:\\QUALIDAD\\CLIENTES","PENDENTE – sem print","Plano de ações detalhado de cada auditoria (ação, responsável, prazo, evidência) – formulário do cliente ou planilha interna; enviar print."],["Excel Planos de Ações de Auditorias de Clientes – aba Cronograma de Visita_Auditoria","Diretório Q:\\QUALIDAD\\CLIENTES","Título da aba","Texto fixo no topo: \"Cronograma Geral de Visitas/Auditorias de Clientes na Cinpal\", com logo Cinpal. Uma linha por visita/auditoria, em ordem cronológica."],["Excel Planos de Ações de Auditorias de Clientes – aba Cronograma de Visita_Auditoria","Diretório Q:\\QUALIDAD\\CLIENTES","Data","Texto livre ou data – dia ou período da visita. Formato varia: \"20/01 a 22/01\", \"27/04 e 28/04\", data única (10/04/2026) e às vezes com a palavra \"CONFIRMADA\" na mesma célula (ex.: \"10/08 e 11/08 CONFIRMADA\")."],["Excel Planos de Ações de Auditorias de Clientes – aba Cronograma de Visita_Auditoria","Diretório Q:\\QUALIDAD\\CLIENTES","Mês","Texto – mês da visita (ex.: Janeiro, Abril, \"Setembro/Outubro\"). Em uma linha aparece como data (fev/2027 exibido \"Feb-27\"), sem padrão."],["Excel Planos de Ações de Auditorias de Clientes – aba Cronograma de Visita_Auditoria","Diretório Q:\\QUALIDAD\\CLIENTES","Cliente","Texto – cliente que visita/audita. Ex.: Grupo Traton (Man / Volks / Scania), Iveco, Volvo Trucks, Volvo ],[852,137]],"t":""},{"p":[[912,102],[958,102]],"t":""},{"p":[[1078,102],[1101,102]],"t":""},{"p":[[1155,267],[1155,337],[1247,337]],"t":"Sim"},{"p":[[1180,242],[1948,242]],"t":"Não"},{"p":[[1705,340],[1843,340],[1843,127]],"t":""},{"p":[[1868,102],[2008,102],[2008,207]],"t":"Sim"},{"p":[[2068,242],[2154,242]],"t":""},{"p":[[522,276],[522,306]],"t":""},{"p":[[1535,340],[1585,340]],"t":""},{"p":[[1367,492],[1475,492],[1475,375]],"t":""},{"p":[[1307,372],[1307,457]],"t":""},{"p":[[1818,102],[1307,102],[1307,307]],"t":""},{"p":[[1155,137],[1155,217]],"t":""},{"p":[[192,119],[192,206]],"t":""},{"p":[[246,241],[298,241]],"t":""}],"arts":[]}],"pdfs":[]},{"id":"cep-spc","titulo":"CEP / SPC","grupo":"Qualidade","keyuser":"Lucilda","status":"Concluído","sap":"Características com controle estatístico no plano de inspeção (QP01), resultados registrados por amostra (QE51N) e gráficos de controle (QGC1). Um CEP mais avançado pode continuar em ferramenta especializada, integrada ao SAP. Antes, a regra de capabilidade (1,33 ou 1,67) precisa ser decidida.","conceito":"Estabelecer diretrizes para a garantia da qualidade do produto no processo de fabricação.","sub":"CEP / SPC","armazenamento":"Rede informatizada – CEP (L:)","atores":["SGQ/CQ","Engenharia de Processo/Produção","Engenharia de Produto (EGP)","Cliente"],"raci":[{"etapa":"Definir as características especiais, conforme cliente","r":["I","I","R","C"]},{"etapa":"Providenciar os estudos estatísticos iniciais","r":["I","R","I","I"]},{"etapa":"Implementar carta de controle por 30 dias no processo","r":["R","I","I","I"]},{"etapa":"Realizar estudo CPK","r":["R","R","I","I"]},{"etapa":"Implantar a Carta Controle e registrar no Gráfico Farol","r":["R","I","I","I"]},{"etapa":"Manter registro no Gráfico Farol","r":["R","R","I","I"]},{"etapa":"Analisar a carta","r":["R","I","I","I"]},{"etapa":"Agendar estudos anuais para as características","r":["R","I","I","I"]},{"etapa":"Anexar ao PPAP do Cliente","r":["","","R",""]},{"etapa":"Realizar novo Estudo CPK","r":["R","R","I","I"]},{"etapa":"Implantar a Carta Controle e registrar no Gráfico Farol","r":["R","R","",""]},{"etapa":"Toma as ações corretivas (melhorias caso existente)","r":["","R","",""]},{"etapa":"Inserir no plano de controle a inspeção 100% das peças","r":["","R","",""]}],"sipoc":[["Cliente","Desenho / requisitos e características especiais do cliente","Controle Estatístico do Processo (CEP)","Requisitos registrados para o produto novo","Engenharia de Produto (EGP)"],["Engenharia de Produto (EGP)","Desenho do produto","","Determinação das caracteristicas significativas","Engenharia de Processo (PRU)"],["SGQ – CEP","Dados coletados","","Estudo de capabilidade (Cp, Cpk, Pp, Ppk) aprovado ou reprovado","Engenharia de Processo / PPAP / Cliente"],["SGQ – CEP","Estudo com processo incapaz","","Pedido de ação corretiva (PSGQ-03)","Produção / Engenharia de Processo"],["Produção / Engenharia de Processo","Ação corretiva implantada","","Novo estudo de capabilidade ou nova carta","CQ – CEP"],["Engenharia de Processo","Processo ainda incapaz","","Plano de controle temporário com inspeção 100%","Produção / Cliente"],["Engenharia de Processo","Processo capaz que requer monitoramento","","Carta de controle X-R com cabeçalho e limites traçados","Produção (Operador)"]],"regras":{"SLA":"- Processo otimizado: carta de controle por 30 dias (corridos – confirmar) a partir da implantação da melhoria.\n- Estudo preliminar: antes do início da produção / submissão do PPAP.\n- Estudo de capabilidade das características especiais: anual.\n- Frequência de medição na carta: conforme Plano de Controle; início = quantidade produzida em 1 hora.\n- Auditoria das cartas: mínimo 2 por turno.\n- Carta: entregue na caixa do CEP ao fim de cada lote ou quando completa; arquivada no fim do preenchimento.\n- Reunião de avaliação dos processos: trimestral.\n- Retenção: cartas e estudos 1 ano calendário (eletrônico).","Critérios":"Para produto novo, a EGP faz o desenho e a Engenharia de Processo monta FMEA, FO e Plano de Controle, marcando as características especiais do cliente e as de processo. O CEP faz o estudo preliminar com carta X-R (25 subgrupos, mínimo 125 medidas), com os alertas de causa especial ligados no software: estudo com causa especial ou tendência não é aprovado. Processo estável: Pp e Ppk > 1,67 aprovado; 1,33 a 1,67 produz com atenção adicional; < 1,33 exige plano de ação corretiva e mais inspeção. Processo instável: inspeção 100% até Cpk 1,33 ou autorização do cliente. Em processo existente, a Produção avisa o CQ quando vê variação excessiva; o CEP investiga e faz o estudo. Processo incapaz: Produção/Engenharia tomam ação corretiva (PSGQ-03), novo estudo e, se continuar incapaz, inspeção 100%. Processo capaz que precisa de monitoramento recebe carta X-R (operador mede 3 peças, CEP calcula mediana e amplitude). Sinal fora de controle: ponto fora dos limites, 7 pontos seguidos acima/abaixo da linha média ou 7 crescentes/decrescentes. Causa especial o operador corrige; causa comum vai para o responsável do setor; tudo registrado no diário de bordo. Se não precisa de carta, mantém registro no gráfico farol e agenda estudo anual. O Técnico do CEP acompanha os índices na planilha e avisa as gerências quando algum fica < 1,67.","Desafios \n(oportunidades de melhorias)":"- Cartas de controle e diário de bordo em papel, digitalizados depois: sem alerta em tempo real e com pouca rastreabilidade.\n- Vários softwares em paralelo (Quality Analyst, Minitab, ISOQualitas.PLM, Excel) e planilha de monitoramento antiga (form. 30-066, rev. 2012).\n- Critério de capabilidade divergente: fluxo da pág. 4 e item 7.4 usam 1,67; fluxo da pág. 9 usa 1,33 (confirmar qual vale).\n- Tipo de carta divergente: texto fala em \"Mediana-Amplitude (X-R)\", o Anexo 3 é \"Individuais-Amplitude\".\n- Limites de controle fixados em % da especificação (LSC = 60% do LSE, LSR = 50% da tolerância), e não calculados pelos dados do processo (confirmar com a norma do cliente / manual SPC).\n- No fluxo da pág. 4, quando \"não precisa de estudo\", a seta vai direto para ação corretiva (confirmar).\n- Histórico cita anexos de requisitos específicos de clientes (Cummins, MBB, Meritor, MWM, Scania, Volvo, VW/MAN) que não aparecem na relação de anexos.\n- Gráfico farol sem formulário/registro definido no procedimento.","Partes interessadas\n (Áreas envolvidas)":"Controle da Qualidade (CQU / CQV – CEP), Engenharia de Usinados (EGU), Engenharia de Forjaria (EGF), Engenharia de Produto (EGP), Engenharia de Processo (PRU / PRV / PRF), Produção (operadores, preparadores, líderes, encarregados), Gerência da Qualidade e de Produção, clientes.","Procedimento \n(nome do documento)":"PCEP – Procedimento de Controle Estatístico do Processo, rev. 04 (11/03/25)"},"tabelas":[["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Máquina","Texto: máquina onde a característica é controlada."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Característica","Texto: característica controlada (ex.: diâmetro)."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Produto Nº","Texto: código da peça."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Op","Texto: número da operação do processo."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Freq","Texto: frequência de amostragem (ex.: 1 pç / hora), conforme Plano de Controle."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Equipamento de medição","Texto: meio de medição a usar (citado no item 7.3.10; confirmar posição no cabeçalho)."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Média das medidas (X=)","Número: linha média do gráfico das medidas."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","Média das amplitudes (R=)","Número: amplitude média (pelo PCEP, 25% da tolerância)."],["Carta de Controle F PCEP-01","Rede informatizada – CEP (L:)","LSC / LIC – Individuais","Número: limite ão / Engenharia / SGQ"],["Gerência de Produção","Resultados e planos","","Apresentação na reunião de resultados e análise crítica","Diretoria"]],"regras":{"Critérios":"Quando uma peça não conforme é encontrada no processo ou na inspeção final, o CQ identifica com etiqueta vermelha, segrega e emite a Supervisão de Defeitos (SD). Se não puder recuperar, emite o Relatório de Refugo (RR) – na Fundição, o Relatório Diário de Sucata –, sucateia as peças e envia o RR ao Supply Chain, que lança a sucata no sistema legado (IntraNET). Se puder recuperar, Engenharia e CQ definem o método no verso da SD, a Produção retrabalha e o CQ reinspeciona 100%. Devoluções e reclamações de clientes entram pelo RID no controle de PPM. Os lançamentos do legado alimentam o Power BI, com Pareto por área, máquina, defeito, causa e produto. A Gerência analisa semanal/mensalmente; se o indicador passar da meta ou mostrar tendência, define plano de ação/RNC; tudo é apresentado na reunião de resultados e na análise crítica.","Desafios \n(oportunidades de melhorias)":"Apontamento de sucata em sistema legado (IntraNET) separado da produção; formulários SD/RR em papel;\nRetrabalho não tem indicador próprio;\nReincidência de defeitos não é monitorada de forma estruturada.","Partes interessadas\n (Áreas envolvidas)":"Produção (Fundição, Forjaria, Usinagem, Tratamento Térmico), Controle da Qualidade (CQD, CQF, CQU), Engenharias de Processos, Supply Chain/PCP, Laboratório, Suporte ao Cliente, SGQ, Diretoria Industrial; clientes (PPM).","Politica\n (nome do documento)":"Política da Qualidade (MSQ)","Procedimento \n(nome do documento)":"PPDD rev. (16/02/21) Produção Fundição; PPDF rev. 30 (14/10/25) Forjaria; PPDU rev. 41 (30/10/25) Usinagem; PPTT (28/03/24) Tratamento Térmico; PCQD rev. 24 (05/08/24); PCQF-2 (19/09/25); PCQU-2 rev. 32 (30/10/25); PSGQ-03.","Instrução de Setor\n (nome do documento)":"IS SGQ 011 – Supervisão de Defeitos (formulário F ISSGQ011-01)."},"tabelas":[["Sistema legado IntraNET – La as":{"SLA":"MSA: Todos os estudos são monitorados através do sistema Cinpal e normalmente são realizados a cada 5 anos. Os estudos são registrados no Sistema Minitab.","Tempo Médio Aproximado( TMA)":"Não aplicável","Alçada de Aprovação":"Não aplicável","Critérios":"O MSA (AIAG 4ª ed.) é feito por família no Minitab, com resultado lançados no Minitab e Sistema de Metrologia para controle dos prazos dos próximos estudos.\nO Instrumentista planeja o estudo de MSA por família (menores tolerâncias no SC e os inspetores que medem), também são determinados quem serão os responsáveis por realizar as medições dos estudos. O estudo de MAS é realizado a cada 5 anos .\nÉ usado o Minitab e emitido o formulário F PCAL 05 (%GRR) para registrar os resultados. Quando reprovado (instrumento, método ou treinamento), arquivar o estudo na Rede MSA e liberar o sistema de medição.","Desafios \n(oportunidades de melhorias)":"MSA feito fora do sistema (Minitab) e arquivado no Sistema de Metrologia Cinpal.","Partes interessadas\n (Áreas envolvidas)":"CQU, CQV, LAB, TTU, LAD, CQD e CQF; Engenharia de Processos; áreas usuárias (fundição, forjaria e usinagem); laboratórios externos; clientes","Procedimento \n(nome do documento)":"PCAL – Procedimento de Calibração, rev. 37 (05/05/2026)","Instrução de Setor\n (nome do documento)":"IS SGQ-016 (meios de medição alternativos)"},"tabelas":[["SC – Consulta MSA","SC – Sistema de Metrologia (legado)","MSA (campo de pesquisa)","Código da análise a consultar; em branco lista os estudos dos setores do usuário."],["SC – Consulta MSA","SC – Sistema de Metrologia (legado)","Análise","Código do estudo: prefixo da área + número (ex.: MSA-CQU0612, MSA-CQV0132)."],["SC – Consulta MSA","SC – Sistema de Metrologia (legado)","Sistemas de Medição","Código + descrição do instrumento (ex.: 06-02-09798 – CALIBRADOR ANEL CONDIÇÃO DE MONTAGEM)."],["SC – Consulta MSA","SC – Sistema de Metrologia (legado)","Área de Uso","Setor que usa o instrumento (ex.: RETÍFICA, USINAGEM tação de desvio ou sucata; Eng. de Produto defere ou indefere o desvio.","Critérios":"1. Toda análise inicia com a geração de um número de SA (Solicitação de Análise) no Sistema de SA.\n2. Para os testes de tração e impacto, emite-se Nota Fiscal e envia-se o material para a Planta 3, onde o corpo de prova é confeccionado. Para a medição de dureza, o corpo de prova é preparado por retífica/lixamento.\n3. Após os ensaios, o caminho é definido pelo solicitante: Produção, CQ Recebimento / Eng. de Produto ou Qualidade.\n4. Qualidade envia produtos de fornecedor externo/importação; CQ Recebimento envia componentes comprados.\n5. Laboratório – aprovado: registrar a peça (etiqueta no corpo de prova / Banco de Dados Laboratório), aprovar na SA, emitir o Cartão Verde e enviar à Produção, que anexa o cartão APROVADO ao lote e envia à próxima etapa.\n6. Produção – reprovado: realizar o Processo de Inspeção (controle dimensional + análise de corpo de prova; não conforme → Eng. Processos Especiais decide retrabalho, solicitação de desvio ou sucata).\n7. Laboratório - Se o cliente for CQ Recebimento / Eng. de Produto: registrar a peça, emitir relatório metalúrgico (laudo), registrar o resultado na SA; o solicitante recebe o laudo e envia as peças à próxima etapa.\n8. Laboratório - Se o cliente interno for a Qualidade: registrar a peça, emitir laudo, registrar na SA e registrar o resultado no Portal de Importações. Peças aprovadas → Qualidade recebe o laudo; reprovadas → Engenharia de P&D Aplicação e Reposição analisa.","Desafios \n(oportunidades de melhorias)":"• Destino da análise da Eng. P&D (devolução ao fornecedor, desvio, sucata) não definido.\n• Subprocessos de Teste de Tração, Impacto e Medição de Dureza não detalhados; normas/especificações de ensaio não citadas.\n\n\n• Oportunidade SAP: SA e resultados no módulo QM (lote de controle / registro de resultados) com integração ao Portal de Importações.","Partes interessadas\n (Áreas envolvidas)":"Laboratórios, Produção, CQ Re SLA":"Programar a calibração com 60 dias de antecedência ao vencimento. Prazo de retorno do laudo pelo fornecedor: confirmar.","Tempo Médio Aproximado( TMA)":"5 diaS","Critérios":"O PCM revisa a planilha de vencimentos e identifica os instrumentos que vencem em até 60 dias. Se houver, seleciona os instrumentos e verifica com a área usuária a janela operacional para retirada. A Engenharia de Manutenção define se a calibração será interna ou externa. No caso externo, o PCM contacta um fornecedor qualificado, programa a calibração e providencia o envio. A empresa terceira executa a calibração conforme procedimento e emite o laudo. O PCM confere se o laudo está completo e conforme, e se não estiver, devolve à terceirizada para correção. Com o laudo conforme, a Engenharia analisa a situação do instrumento. Se aprovado, o PCM atualiza a planilha com a nova data, arquiva o laudo no sistema e o instrumento recebe a etiqueta de calibração. Se reprovado, registra-se a não conformidade e a Engenharia avalia reparo (interno ou externo) ou substituição.","Desafios \n(oportunidades de melhorias)":"Controle de vencimentos em Excel, sem alerta automático. Prazo fixo de 60 dias para todos os instrumentos, sem considerar o lead time de cada classe. Fluxo interno de calibração não detalhado. Ausência de recalibração após reparo no fluxo."},"tabelas":[["Planilha de controle de Calibração e Ensaios","Diretorio de rede","Nº DA CAIXA","Número da caixa de controle do equipamento"],["Planilha de controle de Calibração e Ensaios","Diretorio de rede","Nº PLANTA","Unidade de instalação do equipamento"],["Planilha de controle de Calibração e Ensaios","Diretorio de rede","SETOR","Setor onde o equipamento está localizado"],["Planilha de controle de Calibração e Ensaios","Diretorio de rede","PROCESSO OU LOCALIZAÇÃO","Processo industrial ou área específica de localização"],["Planilha de controle de Calibração e Ensaios","Diretorio de rede","NOME DO EQUIPAMENTO QUE UTILIZA O VASO DE PRESSÃO E/OU MAN o"]],"regras":{"SLA":"Frequência da rota (diária, conforme o fluxo) e tempo máximo de atendimento após o alarme de nível baixo.","Tempo Médio Aproximado( TMA)":"1 dia","Alçada de Aprovação":"Alteração de parâmetros da rota aprovada pela gestão da Engenharia de Manutenção.","Critérios":"A Engenharia de Manutenção identifica a necessidade de alteração (nova máquina ou melhoria) e atualiza os parâmetros na rota de lubrificação em Excel. O lubrificador consulta a rota do dia e verifica se há vazamento. Se houver, abre-se uma ordem de serviço para correção. Se não houver, ele abastece o reservatório e preenche a folha de consumo. O PCM lança o consumo no aplicativo (PowerApp) e o processo é finalizado. Em paralelo, quando o sensor dispara o alarme de nível baixo, a Operação/Produção aciona o lubrificador para abastecimento.","Desafios \n(oportunidades de melhorias)":"Rota em Excel, sem integração com o PowerApp. Duplo registro do consumo (folha e aplicativo). Alarme de nível baixo cobre só as máquinas com sensor (confirmar). O fluxo não mostra o retorno ao abastecimento após a OS de vazamento. Não há análise do consumo lançado.","Partes interessadas\n (Áreas envolvidas)":"Engenharia de Manutenção, PCM, lubrificadores, Operação/Produção"},"tabelas":[["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","TAG da máquina","Identificação única da máquina."],["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","Descrição / Setor","Máquina e área onde está instalada."],["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","Ponto de lubrificação","Local da máquina a ser lubrificado."],["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","Tipo de lubrificante","Produto especificado para o ponto."],["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","Quantidade / volume","Quantidade prevista por abastecimento."],["Rota de lubrificação (Excel)","Diretório de manutenção (confirmar)","Frequência","Int uadro), com retrabalho de registro. Controle de etiquetas em Excel, sem integração com o sistema interno. Caderno e quadro físicos, com risco de divergência. Prazo de tratamento por cor e critério de priorização não definidos. Fluxo sem retorno ao operador sobre a baixa (confirmar). Etiqueta azul sem tratativa visível neste mapa. Sem indicador de etiquetas abertas, tratadas e em atraso (confirmar).","Partes interessadas\n (Áreas envolvidas)":"PCM, Operação/Produção, Segurança do Trabalho, Engenharia de Manutenção"},"tabelas":[["Etiqueta TPM (física)","Quadro de Gestão à Vista","Nº da etiqueta","Identificação única. Confirmar se é numerada."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Cor","Lista: verde (segurança), vermelha (manutenção), azul (operação)."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Data de abertura","Data em que a etiqueta foi aberta."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","TAG / equipamento / setor","Local da anomalia."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Descrição da anomalia","Texto livre."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Solicitante","Quem abriu a etiqueta."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Data de coleta","Data em que o PCM coletou."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Destino","Manutenção Programada ou outro (confirmar)."],["Etiqueta TPM (física)","Quadro de Gestão à Vista","Status","Aberta, coletada, no quadro, programada, concluída (confirmar)."],["Quadro de Gestão à Vista","Local físico","Aguardando Planejamento","Etiquetas aguardando tratativas"],["Quadro de Gestão à Vista","Local físico","Planejada","Etiqueta planejada pelo PCM"],["Quadro de Gestão à Vista","Local físico","Programada","Etiquetas programada"],["Quadro de Gestão à Vista","Local físico","Executada","Etiquetas executadas"],["Quadro de Gestão à Vista","Local físico","Pendentes","Etiquetas pendentes"],["Planilha de Controle de Etiquetas e Anomalias","TPM_REDE (\\\\C a liderança atua no Gemba e o Assessment mostra evolução de maturidade.","sub":"5S","armazenamento":"Q:\\Gestão 2026\\5S PRODUÇÃO\\01. GOVERNANÇA\\01.08 PADRÕES (caminho no rodapé dos formulários); quadros de Gestão à Vista das áreas; registros pela Gestão Documental corporativa","atores":["Operador / usuário","Líder da área","Gestor da área","Facilitador / Excelência Operacional (auditor)","Comitê 5S / Direção","Funções de suporte (Segurança, Qualidade, Manutenção/TPM, Patrimônio)"],"raci":[{"etapa":"Preparar: definir patrocinador, donos, divisão das áreas, treinamento e cronograma","r":["","C","A","R","I",""]},{"etapa":"Diagnosticar a condição atual por senso (baseline com fotos)","r":["C","R","A","C","",""]},{"etapa":"1º S Seiri: levantar itens, classificar pela frequência de uso e segregar com etiqueta","r":["R","A","","C","",""]},{"etapa":"Aprovar destino de itens que exigem aprovação (descarte, venda, transferência, patrimônio)","r":["","C","A","","","R"]},{"etapa":"Executar a destinação e definir limites de quantidade","r":["R","A","","","","C"]},{"etapa":"2º S Seiton: definir local e quantidade, endereçar, identificar e demarcar","r":["R","A","","C","",""]},{"etapa":"Testar a organização com os turnos e corrigir","r":["C","R/A","","","",""]},{"etapa":"3º S Seiso: limpar inspecionando e mapear fontes de sujeira (anomalia de equipamento vai para TPM)","r":["R","A","","","","C"]},{"etapa":"Abrir tratamento de anomalia de equipamento no TPM / Manutenção","r":["I","A","","","","R"]},{"etapa":"4º S Seiketsu: emitir padrão visual (foto, responsável, frequência, reação)","r":["C","R","A","C","",""]},{"etapa":"Aprovar o padrão e treinar a equipe","r":["I","","R/A","C","",""]},{"etapa":"5º S Shitsuke: integrar à Gestão Diária, autoinspeção e Gemba","r":["C","R","A","","",""]},{"etapa":"Fazer a autoinspeção diária e manter a condição","r":["R","A","C","I","",""]},{"etapa":"Corrigir desvio simples no ato","r":["R","A","C","C","",""]},{"etapa":"Registrar a ação 5S (origem, criticidade, dono, prazo, aging)","r":["C","R/A","","","",""]},{"etapa":"Conduzir a reunião 5S da área (semanal) – decidir local ou escalar","r":["C","R/A","C","C","",""]},{"etapa":"Decidir no Tier dentro da alçada","r":["","R","A","C","",""]},{"etapa":"Decidir tema transversal, recurso ou revisão de padrão no Comitê 5S (mensal)","r":["","C","C","R","A",""]},{"etapa":"Aprovar investimento ou resolver conflito de prioridade (fórum executivo)","r":["","","R","C","A",""]},{"etapa":"Executar a ação (correção, PDCA, A3 ou Kaizen)","r":["R","R","A","","","C"]},{"etapa":"Verificar eficácia, atualizar o padrão e fechar a ação","r":["R","A","C","C","",""]},{"etapa":"Auditoria da liderança (semanal)","r":["C","R","A","C","",""]},{"etapa":"Auditoria EO / cruzada (mensal) com constatação objetiva","r":["","C","C","R/A","",""]},{"etapa":"Auditoria gerencial (trimestral) e Gemba Walk 5S","r":["C","R","A","C","",""]},{"etapa":"Assessment de maturidade (níveis 1 a 5) e roadmap","r":["","C","C","R/A","C",""]},{"etapa":"Integrar constatações às ações da Gestão Diária","r":["","R","A","C","",""]},{"etapa":"Analisar tendência e maturidade, reconhecer e replicar boas práticas","r":["","R","A","R","C",""]}],"sipoc":[["Patrocinador / Excelência Operacional","Escopo, áreas, donos e treinamento","5S","Plano de implantação e mapa de áreas com responsáveis","Gestor e líder da área"],["Líder da área","Condição atual, fotos e dados","","Plano de ação) por senso","Gestor / EO"],["Operadores","Inventário dos itens da área","","Itens destinados, segregação com dono e prazo, limites de quantidade (Seiri)","Líder / Funções de suporte"],["Operadores","Itens necessários, frequência e sequência de uso","","Locais endereçados, identificados e demarcados (Seiton)","Usuários de todos os turnos"],["Operadores","Limpeza com inspeção","","Fontes de sujeira e anomalias de equipamento tratadas (Seiso)","TPM / Manutenção"],["Líder da área","Melhor condição conhecida","","Padrão visual aprovado e equipe trein  para todo desvio); transversal → Tier/Comitê; crítico → conter e escalar. Auditoria verifica conformidade, Gemba Walk desenvolve a liderança e Assessment mede maturidade (níveis 1 Inicial a 5 Referência) – um não substitui o outro. Autoavaliação do 5º S: 50–69% Bom, 70–89% Muito bom, 90–100% Excelente.","Desafios \n(oportunidades de melhorias)":"Formulários em Excel/papel e quadro físico, sem histórico centralizado; risco de virar campanha ou preparação para auditoria (o manual alerta); ranking pode estimular maquiagem; aging dependente de controle manual.","Partes interessadas\n (Áreas envolvidas)":"Operadores, líderes, gestores das áreas, Excelência Operacional, Comitê 5S, Direção, Segurança, Qualidade, Manutenção/TPM, Logística, Patrimônio/Contabilidade, Meio Ambiente, RH, Gestão Documental, TI/Segurança da Informação (áreas administrativas e digitais).","Procedimento \n(nome do documento)":"Manual Corporativo do Sistema 5S (Manual Excelência Operacional – Volume 7); interfaces: Gestão da Rotina / Gestão Diária, Lean, TPM, Qualidade e Segurança"},"tabelas":[["Checklist de Atividades de Limpeza","Q:\\Gestão 2026\\LEAN\\5S","Local / Equipamento / Frequência","Cabeçalho (texto)."],["Checklist de Atividades de Limpeza","Q:\\Gestão 2026\\LEAN\\5S","Data / Horário","Data e hora de cada limpeza."],["Checklist de Atividades de Limpeza","Q:\\Gestão 2026\\LEAN\\5S","Piso / Paredes / Mesas e cadeiras / Impressora / Computadores","Marcação por item limpo."],["Checklist de Atividades de Limpeza","Q:\\Gestão 2026\\LEAN\\5S","Assinatura / Observações","Quem executou e anotações."],["Padrão do Quadro de Gestão à Vista 5S","Q:\\Gestão 2026\\LEAN\\5S","Área","Texto (ex.: TODAS)."],["Padrão do Quadro de Gestão à Vista 5S","Q:\\Gestão 2026\\LEAN\\5S","Conteúdo do quadro (01 a 07)","Quadro de gestão autônoma, Foto do time, Plano de ação (indicador + lista de ações), Lay-out, Manutenção 5S, Check list 5S, Sugestões dos colaboradores."],["Padrão do Quadro de Gestão à Vista 5S","Q:\\Ge aci":[{"etapa":"Identificar necessidade, perdas e impactos SQDCP","r":["C","","R/A","","C","",""]},{"etapa":"Confirmar escopo, cliente, fornecedor e dono","r":["C","","R/A","","","","I"]},{"etapa":"Levantar dados e condição real no Gemba","r":["","","R/A","C","C","",""]},{"etapa":"Analisar estabilidade, riscos e interfaces (condições e evidências suficientes? se não, voltar ao Gemba)","r":["C","","A","R","","",""]},{"etapa":"Definir condição desejada, meta e indicadores","r":["C","","R/A","","","","I"]},{"etapa":"Avaliar aplicabilidade e selecionar método(s) (aplicável e pré-requisitos atendidos? se não, criar estabilidade)","r":["R","A","C","C","","",""]},{"etapa":"Priorizar portfólio, gate, recursos e liberação","r":["","C","C","","","","R/A"]},{"etapa":"Planejar implantação, piloto e controles de risco","r":["C","","R/A","C","","",""]},{"etapa":"Selecionar o método / interface a tratar e executar o subprocesso Lean (VSM, Takt, TP, Yamazumi, Logística, A3/PDCA/Kaizen, Gargalos, Puxada/Heijunka, Gestão visual, Fluxo contínuo, FIFO/Kanban, Gemba Walk, SMED)","r":["R","A","C","R","","",""]},{"etapa":"Consolidar entregáveis técnicos e resultados (há outro método necessário?)","r":["C","","R/A","C","","",""]},{"etapa":"Executar piloto e verificar segurança, qualidade e fluxo (meta e critérios de aceitação atingidos?)","r":["C","","R/A","R","C","",""]},{"etapa":"Corrigir causas, método e parâmetros e repetir o piloto","r":["C","","A","R","","",""]},{"etapa":"Atualizar padrões, documentos e gestão visual","r":["C","","R/A","","I","",""]},{"etapa":"Treinar equipe e confirmar competência","r":["C","","A","R","C","",""]},{"etapa":"Integrar indicadores, reação e escalonamento aos Tiers","r":["C","","A","","R","",""]},{"etapa":"Executar Gemba Walk, auditoria e assessment (eficácia e sustentação comprovadas? se não, tratar desvio)","r":["","A","C","","C","R",""]},{"etapa":"Escalar bloqueios e aprovar fechamento / replicação","r":["","C","I","","","","R/A"]},{"etapa":"Monitorar EO"],["Dono do processo","Meta e critérios de aceitação atingidos","","Padrões, documentos e gestão visual atualizados; equipe treinada","Liderança operacional (Tiers)"],["Liderança operacional (Tiers)","Indicadores, reação e escalonamento integrados","","Rotina de sustentação nos Tiers","Auditoria e Avaliação Lean"],["Auditoria e Avaliação Lean","Gemba Walk, auditoria e assessment","","Eficácia e sustentação comprovadas (ou desvio para tratar)","Governança estratégica"],["Governança estratégica","Bloqueios e pedido de fechamento / replicação","","Fechamento aprovado e replicação decidida","Tiers / outras unidades"],["Tiers","Mudanças, desvios e maturidade monitorados","","Ciclo concluído e sob controle (ou nova necessidade)","Dono do processo / Governança"]],"regras":{"SLA":"Governança operacional (Tiers): por turno e/ou diária.\nGovernança tática: semanal / mensal, conforme processo.\nGovernança estratégica: mensal / trimestral, conforme ciclo do negócio.\nGovernança metodológica: periódica e por gatilho (mudança, desvio, dúvida).\nAging de ações: escalonar conforme regra corporativa de Gestão Diária.\nPeríodo de sustentação antes do fechamento: definido por iniciativa.\nMetas de cada método são definidas na iniciativa (ex. do manual: setup ≤ 30 min no SMED).","Alçada de Aprovação":"- Seleção e integridade do método: Excelência Operacional / Lean (dono metodológico).\n- Priorização, gates G0–G6, recursos e investimentos: Governança tática/estratégica conforme alçada (Direção para investimento relevante ou risco estratégico).\n- Liberação do padrão (TP-07): dono do processo + aprovação técnica + Lean/EO quando aplicável.\n- Fechamento e replicação: Governança estratégica, após auditoria comprovar eficácia.\n- Alteração de método, critério, fórmula, gate ou responsabilidade de template: Governança Metodológica Lean.","Critérios":"Toda aplicação Lean nasce de uma demanda, desvio, risco ou oportunidade (não da ferramenta). O dono do processo identifica as perdas SQDCP, confirma escopo e dono e levanta a condição real no Gemba; a equipe multidisciplinar analisa estabilidade e riscos e, sem evidência suficiente, volta ao Gemba. Definida a meta, a EO avalia a aplicabilidade (Obrigatório / Aplicável / N/A com justificativa) e seleciona o método; sem pré-requisitos, primeiro cria estabilidade. A governança prioriza pela matriz (retorno 30%, estratégia 20%, cliente/qualidade/entrega 15%, capacidade 15%, esforço 10%, risco 10%; projetos obrigatórios por segurança/legislação/cliente não são rejeitados por retorno) e libera nos gates G0–G6. O dono planeja o piloto e executa um ou mais subprocessos Lean; consolida resultados e, se precisar, seleciona outro método. Piloto sem meta atingida volta para correção. Atingida a meta, atualiza padrões e gestão visual, treina, integra aos Tiers e a auditoria comprova eficácia e sustentação antes do fechamento; mudanças relevantes reabrem o ciclo.","Desafios \n(oportunidades de melhorias)":"Não há sistema: pipeline, gates, decisões e evidências em documentos Word/Excel e quadros físicos – difícil consolidar portfólio e benefícios.\nBenefício estimado x realizado sem controle automático.\nAging e escalonamento dependem da disciplina dos Tiers, sem alerta.\nRastreabilidade entre iniciativa, padrão (TP), treinamento e auditoria feita à mão.","Partes interessadas\n (Áreas envolvidas)":"Excelência Operacional / Lean, donos de processo, Produção, Engenharia (Manufatura/Processo), Qualidade, Manutenção/TPM, PCP, Logística, Segurança, RH (competência), Direção da unidade/corporativa, clientes internos e externos.","Procedimento \n(nome do documento)":"Manual Corporativo Sistema Lean Manufacturing – Manual Excelência Operacional"},"tabelas":[["Manual Lean – Matriz Corporativa de Priorização","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Critério / Pergunta de decisão / Peso de referência","Tabela: Retorno/benefício 30%, Impacto estratégico 20%, Cliente/qualidade/entrega 15%, Capacidade/produtividade 15%, Esforço/investimento 10%, Risco e viabilidade 10%."],["Manual Lean – Proposta de iniciativa (portfólio)","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Problema/oportunidade; Escopo; Baseline; Meta; Benefício estimado; Investimento/esforço; Risco/urgência; Alinhamento estratégico; Método provável; Sponsor e dono","Texto/número por iniciativa; benefício com premissas declaradas (não tratar estimado como realizado)."],["Manual Lean – Indicadores econômicos","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Benefício anual; Payback; ROI; Benefício líquido; Capacidade liberada; Lead Time/WIP/FPY/OEE","Número calculado: Payback = investimento / benefício mensal líquido; ROI = benefício líquido anual / investimento × 100."],["Manual Lean – Gate de liberação","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Gate (G0 Identificada, G1 Triada, G2 Priorizada, G3 Liberada/Planejada, G4 Em execução, G5 Em validação, G6 Sustentação/Conclusão) / Decisão / Saída","Lista de status da iniciativa no pipeline."],["TP-01 Folha de Observação de Tempos e Elementos","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Cabeçalho: Unidade, Área/Linha, Operação, Produto/Família, Data, Revisão","Texto/data de identificação do posto (padrão em todos os TP)."],["TP-01 Folha de Observação de Tempos e Elementos","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Nº; Elemento de trabalho; Tipo; C1 a C10; Ponto-chave/anormalidade","Tipo: M manual, A automático, D deslocamento, E espera, I inspeção; C1–C10 = tempos cronometrados (s). Ex.: Carregar peça M 12 s."],["TP-01 Folha de Observação de Tempos e Elementos","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Resumo: Início/fim do ciclo; CT representativo; Menor CT; Maior CT; Takt aplicável; Condição/observações","Números (s) e texto."],["TP-02 Folha de Capacidade do Processo","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Processo/máquina; Tempo disponível (s/dia); CT (s/peça); Capacidade teórica (peças/dia); Demanda; Gap; Observação","Capacidade = tempo disponível / CT; Gap = capacidade – demanda. Ex.: Torneamento 54.000 s, CT 63 s, 857 pç, demanda 1.000, gap -143."],["TP-03 Folha de Combinação do Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Nº; Elemento; Tipo; escala 0–60 s; Linha do Takt","Gráfico manual x automático x deslocamento; exemplo: Takt 54 s."],["TP-04 Diagrama de Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Desenho do layout; símbolos 1,2,3 (sequência), → (deslocamento), SWIP, S, Q, M, MP","Croqui do posto com pontos críticos de segurança (S) e qualidade (Q)."],["TP-05 Folha de Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Seq.; Elemento/o que fazer; Tempo padrão; Ponto-chave; Regra de reação/anormalidade; Takt; CT padrão; SWIP; Nº operadores; Revisão vigente","Ex.: Takt 54 s/peça; CT ≤ 54 s; SWIP 1 peça; FPY ≥ 98%; aderência ≥ 95%."],["TP-06 Quadro de Elementos de Trabalho","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Nº; Elemento – o que fazer; Ponto-chave – como fazer; Razão – por que é importante; Tempo; Classificação","Texto; razão explica risco de segurança, qualidade, ergonomia, processo ou desempenho."],["TP-07 Registro de Validação do Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Critérios de validação (10 itens: segurança/ergonomia, qualidade, sequência, CT/Takt, SWIP, folhas, operadores, treinamento, gestão visual, obsoletos); Resultado/evidência; Status OK/NOK; Responsável","Checklist de liberação do padrão."],["TP-07 Registro de Validação do Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Padrão liberado? (Sim/Não); Restrições/pendências; Data de vigência; Dono do processo; Aprovação técnica; Lean/EO","Decisão e assinaturas."],["TP-08 Auditoria / Gemba de Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","#; Pergunta de verificação (12 perguntas); Evidência esperada; C / NC / N.A.; Ação/responsável/prazo","Ex.: \"O padrão representa a condição real validada no Gemba?\" – evidência: observação + documento vigente."],["TP-08 Auditoria / Gemba de Trabalho Padronizado","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Resultado: Conformes; Não conformes; N.A.; % aderência; Conclusão (Aderente / Requer ação / Reauditoria)","Números e marcação."],["TP-09 Controle de Revisão e Alteração do Padrão","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Rev.; Data; Motivo/gatilho; Descrição da alteração; Documentos afetados; Treinamento requerido?; Aprovador","Histórico de revisões do padrão."],["TP-09 Controle de Revisão e Alteração do Padrão","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Gatilhos mínimos de revisão (produto/demanda/mix; método/equipamento/layout; Kaizen/rebalanceamento/SMED; requisito de qualidade/segurança; desvio recorrente; auditoria/Gemba/Assessment); Verificação","Marcação ( ) por gatilho."],["LM-FIFO-01 FIFO – Definição e dimensionamento","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Código; Revisão; Data; Objetivo; Aplicabilidade; Responsabilidades; Exemplo prático; Passo a passo; Memória de cálculo (Item, Símbolo, Valor, Unidade); Regras e controle","Rev. 00 de 29/09/2026; ex.: FIFO entre torno (1,2 min/pç) e fresadora (1,0 min/pç) com limite de 9 peças."],["LM-SUP-01 Supermercado – Definição e dimensionamento","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Mesma estrutura do LM-FIFO-01 (objetivo, aplicabilidade, responsabilidades, cálculo, regras); identificação de posição (ex.: SUP-01/R02/N03/P04)","Dimensiona estoque controlado para o tempo de reposição com segurança e limites visuais."],["LM-KAN-01 Kanban – Definição e dimensionamento","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Demanda D; Lead time LT; Segurança α; Lote/cartão C; Kanbans N; Fórmula N = [D × LT × (1 + α)] ÷ C; Regras e controle (6)","Ex.: D 500 pç/dia, LT 2 dias, α 50%, C 100 pç → 15 cartões."],["Templates VSM, Takt/CT/LT, Yamazumi e checklist de Assessment","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Campos","PENDENTE – templates \"a definir\" no manual (emitir após aprovação metodológica)."],["Registros dos Tiers / pipeline / roadmap","Repositório controlado do Sistema Lean (pastas 01_Governança a 07_Treinamento_Competência; local/sistema a confirmar)","Campos","PENDENTE – sem print (confirmar se existe planilha ou sistema de pipeline e registro de decisões)."]],"diagramas":[{"nome":"Sistema Corporativo Lea t":""},{"p":[[2894,237],[3047,237],[3047,315]],"t":"Sim"},{"p":[[3117,355],[3136,355],[3136,473],[3155,473]],"t":""},{"p":[[3295,473],[3314,473],[3314,591],[3333,591]],"t":""},{"p":[[3473,591],[3492,591],[3492,709],[3511,709]],"t":""},{"p":[[3651,709],[3734,709]],"t":""},{"p":[[3759,684],[3759,525],[2869,525],[2869,513]],"t":"Não: tratar desvio"},{"p":[[3784,709],[3937,709],[3937,159]],"t":"Sim"},{"p":[[4007,119],[4026,119],[4026,591],[4045,591]],"t":""},{"p":[[4185,591],[4268,591]],"t":""},{"p":[[4318,591],[4453,591]],"t":"Não"},{"p":[[4293,616],[4293,761],[377,761],[377,395]],"t":"Sim"}],"arts":[{"k":"Annotation","t":"Métodos: VSM, Takt/CT/LT, Trab. Padronizado, Yamazumi, Logística, A3/PDCA/Kaizen, Gargalos, Puxada/Heijunka, Gestão visual, Fluxo contínuo, FIFO/Kanban, SMED, Gemba","x":2260,"y":662,"w":230,"h":95},{"k":"Annotation","t":"Matriz: retorno 30%, estratégia 20%, cliente 15%, capacidade 15%, esforço 10%, risco 10%. Obrigatórios não são rejeitados por retorno","x":2082,"y":72,"w":230,"h":95},{"k":"Annotation","t":"Aplicabilidade: Obrigatório / Aplicável / N/A (com justificativa técnica)","x":974,"y":190,"w":230,"h":95}]}],"pdfs":[]},{"id":"smed","titulo":"SMED","grupo":"Lean","keyuser":"Lucilda","status":"Concluído","sap":"O tempo de setup fica como valor-padrão no roteiro de produção (CA02) e é apontado na confirmação da ordem (CO11N), em PP. Assim o ganho do SMED aparece nos dados de produção, sem planilha à parte.","conceito":"Reduzir o tempo de troca entre produtos (da última peça boa à primeira peça boa) separando o que pode ser feito com a máquina rodando (externo) do que exige máquina parada (interno), para permitir lotes menores e mais flexibilidade, sem abrir mão de segurança e qualidade (Manual Lean, Cap. 9).","sub":"SMED","armazenamento":"Rede Lean – 05_Métodos_Lean","atores":["Produção","Engenharia","Preset / Logística","Qualidade","Lean/EO","Manutenção"],"raci":[{"etapa":"Identificar e priorizar setup crítico","r":["A/R","C","C","I","C","I"]},{"etapa":"Definir escopo, meta e equipe","r":["A","C","C","C","R","C"]},{"etapa":"Observar e cronometrar setup atual","r":["A/R","C","C","I","R","C"]},{"etapa":"Classificar atividades internas e externas","r":["A","R","C","C","R","C"]},{"etapa":"Definir oportunidades de externalização","r":["A","R","R","C","C","C"]},{"etapa":"Desenvolver melhorias técnicas","r":["C","A/R","C","C","C","R"]},{"etapa":"Preparar materiais, ferramentas e dispositivos","r":["A","C","R","I","C","C"]},{"etapa":"Executar testes do novo setup","r":["A/R","R","C","R","C","C"]},{"etapa":"Validar primeira peça conforme","r":["R","C","I","A/R","I","I"]},{"etapa":"Confirmar repetibilidade do novo tempo","r":["A/R","R","C","C","R","C"]},{"etapa":"Aprovar e formalizar padrão operacional","r":["A","R","C","C","C","C"]},{"etapa":"Treinar operadores e substitutos","r":["A/R","C","R","C","C","C"]},{"etapa":"Monitorar indicadores e desvios","r":["A/R","C","C","C","R","C"]},{"etapa":"Auditar aderência ao padrão","r":["A","C","C","C","R","C"]},{"etapa":"Tratar desvios e sustentar resultados","r":["A/R","R","R","R","C","R"]}],"sipoc":[["Produção / PCP","Histórico de setups, frequência de trocas e necessidade de capacidade","1. Selecionar e priorizar setup crítico","Escopo e meta de redução definidos","Produção / PCP"],["Produção / Lean/EO","Sequência atual, tempos, vídeos e observações","2. Observar, cronometrar e registrar o setup atual","Folha de análise SMED e tempos de referência","Engenharia / Lean/EO"],["Produção / Engenharia","Atividades, métodos e condições operacionais","3. Classificar atividades internas e externas","Matriz de atividades internas e externas","Produção / Engenharia"],["Engenharia / Preset / Logística","Ferramentais, dispositivos, materiais e parâmetros","4. Converter atividades internas em externas","Preparação externa e melhorias técnicas","Produção / Preset"],["Engenharia / Manutenção / Produção","Dados técnicos, ajustes, fixações e restrições de segurança","5. Simplificar e otimizar atividades remanescentes","Sequência otimizada e parâmetros definidos","Produção"],["Produção / Qualidade","Critérios de aceitação, limites de processo e requisitos de segurança","6. Testar e validar o novo setup","Tempo validado e primeira peça conforme","Produção / Qualidade"],["Produção / Engenharia / Lean/EO","Resultados dos testes e método aprovado","7. Padronizar, documentar e treinar","Novo padrão, checklist e treinamento","Operadores / Liderança"],["Produção / Lean/EO / Qualidade","Indicadores, registros e evidências de execução","8. Monitorar, auditar e tratar desvios","Indicadores, ações corretivas e sustentação","Gestão operacional / Lean/EO"]],"regras":{"SLA":"Tempo de setup medido da última peça boa da condição anterior à primeira peça boa da nova condição. Meta de referência no exemplo do manual: setup ≤ 30 min (exemplo de torneamento 75 → 30 min; caso completo 120 → 18 min). Novo tempo só vira padrão após várias trocas representativas. Quando virar padrã, deverá alterar a folha de processo e informar o PCP o novo tempo de setup.","Critérios":"Aplicar quando o setup limita capacidade ou frequência, quando lotes grandes são mantidos para diluir troca, quando Heijunka/puxada exigem mais trocas ou quando a troca tem alta variabilidade ou risco. Sequência: 1 selecionar setup; 2 definir início/fim; 3 filmar/observar; 4 listar atividades e tempos; 5 separar interno/externo; 6 converter interno em externo; 7 reduzir internas; 8 otimizar externas; 9 executar em paralelo quando seguro; 10 testar, padronizar, treinar e sustentar. Reação: setup acima do limite → registrar causa e corrigir; material não preparado → tratar logística/preset; primeira peça não conforme → interromper e aplicar reação de qualidade.","Desafios \n(oportunidades de melhorias)":"Setups hoje sem padrão e sem medição sistemática; dependência de preparação externa (preset/logística); risco de adotar o melhor tempo isolado como padrão; treinar substitutos; revisar o padrão a cada novo produto/ferramental.","Partes interessadas\n (Áreas envolvidas)":"Produção, Operadores/Preparadores, Engenharia de Processos, Preset/Logística, Qualidade, Manutenção/TPM, Excelência Operacional/Lean, PCP.","Procedimento \n(nome do documento)":"Manual Corporativo de Lean Manufacturing (Manual Excelência Operacional – Volume 9) – Cap. 9 (SMED – Redução de Tempos de Troca)","Instrução de Setor\n (nome do documento)":"Folha de Processo / Folha de Preset"},"tabelas":[["Troca Rápida – todas as folhas","Rede Lean – 05_Métodos_Lean","Cabeçalho (todas as folhas): Emissão / Revisão / Nome da linha-equipamento / Localização","Data e textos que identificam a máquina (ex. do checklist: emissão 05/07/2023, prensa 4000, Forjaria; revisão em branco)."],["Troca Rápida – folhas 2 a 6","Rede Lean – 05_Métodos_Lean","Rodapé (folhas 2 a 6): Elaborado por / Revisado por","Nomes de quem preencheu (até 3 linhas) e de quem revisou."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 1 – Documentar as atividades das trocas atuais (itens 1 a 7)","Lista fixa: identificar processos, coletar informações, priorizar, documentar elementos, determinar tempo atual, definir objetivos."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 2 – Classificar as atividades em externas e internas (itens 1 e 2)","Interna = só com máquina parada; externa = pode ser feita com a máquina operando."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 3 – Mudar as atividades internas para externas (itens 1 a 4)","Conversão, análise e melhoria das internas; \"5 por quês\"."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 4 – Localizar as atividades paralelas (itens 1 e 2)","Atividades independentes feitas ao mesmo tempo (troca pode cair mais da metade)."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 5 – Dinamizar as atividades internas/externas (itens 1 a 4)","Eliminar ajustes, fixações e moldes, padrões funcionais, equipamentos de troca rápida."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 6 – Selecionar ideias para implementação / Bloco 7 – Testar e verificar o novo procedimento","Examinar praticidade das ideias; esboçar, testar e verificar resultados."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Bloco 8 – Documentar os procedimentos (itens 1 e 2)","Descrever o passo a passo do setup na ITO e colocar no treinamento."],["Troca Rápida – Checklist de Implementação","Rede Lean – 05_Métodos_Lean","Situação de cada tarefa","Não há coluna de status/data/responsável no checklist (confirmar como se marca o que foi feito)."],["Troca Rápida – Matriz de Avaliação","Rede Lean – 05_Métodos_Lean","Nome / Nº do processo","Texto – processo ou troca avaliada (tabela com 9 linhas)."],["Troca Rápida – Matriz de Avaliação","Rede Lean – 05_Métodos_Lean","Duração da troca (min)","Número – tempo atual da troca. Cabeçalho tem comentário (triângulo vermelho)."],["Troca Rápida – Matriz de Avaliação","Rede Lean – 05_Métodos_Lean","Perda de produção (min)","Número – tempo de produção perdido pela troca. Cabeçalho com comentário."],["Troca Rápida – Matriz de Avaliação","Rede Lean – 05_Métodos_Lean","Restrição","Texto – limitação do processo (usada para priorizar a troca a atacar."],["Troca Rápida – Folha de Elementos","Rede Lean – 05_Métodos_Lean","Nome / Nº do processo","Texto (tabela com 12 linhas)."],["Troca Rápida – Folha de Elementos","Rede Lean – 05_Métodos_Lean","Elemento","Texto – cada passo observado na troca (cronometragem)."],["Troca Rápida – Folha de Elementos","Rede Lean – 05_Métodos_Lean","Tempo decorrido (min)","Número – tempo acumulado do cronômetro."],["Troca Rápida – Folha de Elementos","Rede Lean – 05_Métodos_Lean","Tempo de elemento (min)","Número – duração do passo (decorrido atual − anterior; cálculo manual ou automático)."],["Troca Rápida – Folha de Ele entrega, capacidade)","VSM – Value Stream Mapping","Necessidade, objetivo e escopo definidos","Dono do fluxo"],["Dono do fluxo","Necessidade e escopo","","Família, limites e equipe definidos (ou N/A justificado)","Especialista Lean / Equipe"],["PCP, Qualidade, Manutenção, Logística","Demanda, programação, FPY, OEE, estoques, setups","","Mapa do estado atual validado no Gemba","Equipe multifuncional / Dono do fluxo"],["Equipe multifuncional","Mapa atual e análise de perdas","","Estado futuro e Kaizen Bursts","Dono do fluxo"],["Especialista Lean / Equipe","Estado futuro","","Plano de transformação priorizado","Dono do fluxo / Direção / Pipeline Lean"],["Equipe / Engenharia / Manutenção","Ações executadas","","Resultado antes x depois validado","Dono do fluxo / Finanças"],["Dono do fluxo","Nova condição aprovada","","Padrões, gestão visual e indicadores na Gestão Diária","Liderança operacional / Excelência Operacional"]],"regras":{"SLA":"O Manual não define prazo fixo. Prazos e marcos são definidos no plano de transformação de cada VSM (cada ação com prazo e status/aging). O mapa deve ser revisado sempre que um gatilho ocorrer (mudança de demanda/mix, processo, layout, capacidade, programação ou gap de auditoria).","Tempo Médio Aproximado( TMA)":"Existe um roteiro de como será desenvolvido.","Alçada de Aprovação":"Dono do fluxo: aprova escopo, transformação, recursos, resultado e fechamento (A/R). Direção: investimentos e prioridades acima da alçada. Excelência Operacional/Lean: auditoria do método (A/R). Gate de fechamento do ciclo VSM .\nCada projeto que sai do VSM o prazo é determinado pelo cronograma de desenvolvimento do projeto.","Critérios":"Aplicar o VSM somente quando houver necessidade real (fluxo ponta a ponta, Lead Time/WIP altos, fluxo fragmentado ou redesenho); caso contrário, registrar N/A justificado. Mapear no Gemba material e informação com dados mínimos por processo; separar fatos de hipóteses; projetar o estado futuro pela sequência Takt → estabilidade → fluxo contínuo → FIFO → supermercado/puxada → nivelamento → lotes; converter Kaizen Bursts em plano com dono, prazo, indicador e critério de aceite; o ciclo só fecha com resultado validado, padrão incorporado à Gestão Diária e gatilho de revisão definido. VSM feito só em sala não atende ao padrão.\nSeguir os critérios de Gates de Liberação - item 26.6 do Manual.","Desafios \n(oportunidades de melhorias)":"Hoje o VSM é utilizado de frma esporádica e não dentro de uma sistem de produção lea (enxuta). A expansão da ferramenta de forma mais abrangente.","Partes interessadas\n (Áreas envolvidas)":"Dono do fluxo/gestor, Excelência Operacional/Lean, Produção, PCP/Logística, Qualidade, Manutenção/TPM, Engenharia, Finanças/Controladoria, Direção.","Procedimento \n(nome do documento)":"Manual Corporativo de Lean Manufacturing (Manual Excelência Operacional – Volume 9) – Cap. 2 (VSM e Gestão do Fluxo de Valor) e Cap. 1 (Governança Lean)"},"tabelas":[["Ficha mínima de entrada do projeto Lean","Repositório controlado do Sistema Lean – 01_Governança","Problema / oportunidade","Texto: condição atual e impacto. (campo sugerido pelo Manual / boa prática – confirmar com print)"],["Ficha mínima de entrada do projeto Lean","Repositório controlado do Sistema Lean – 01_Governança","Escopo","Texto: processo, família, linha ou fluxo. (campo sugerido pelo Manual / boa prática – confirmar com print)"],["Ficha mínima de entrada do projeto Lean","Repositório controlado do Sistema Lean – 01_Governança","Baseline","Indicadores e condição inicial comprováveis. (campo sugerido pelo Manual / boa prática – confirmar com print)"],["Ficha mínima de entrada do projeto Lean","Repositório controlado do Sistema Lean – 01_Governança","Meta","Resultado esperado e prazo. (campo sugerido pelo Manual / boa prática – confirmar com print)"],["Ficha mínima de entrada do projeto Lean","Repositório controlado do Sistema Lean – 01_Governança","Benefício estimado","Financeiro e/ou operacional, com premissas. (c function renderNav(){ $('#nav').innerHTML=navHTML($('#q').value); document.querySelectorAll('#nav .acc').forEach(d=>d.addEventListener('toggle',()=>{ if($('#q').value) return; d.open?state.open.add(d.dataset.g):state.open.delete(d.dataset.g); })); $('#homeLink').toggleAttribute('aria-current',!location.hash||location.hash==='#inicio'); if($('#homeLink').hasAttribute('aria-current')) $('#homeLink').setAttribute('aria-current','page'); }
